<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Force a fresh copy on every load so admin edits are never blocked by a
     stale cached build of this page. -->

<title>Trans American Trail - Admin</title>
<style>
  :root {
    --bg: #0f141b; --panel: #161d27; --panel2: #1c2430; --line: #232a35;
    --txt: #e7ecf3; --muted: #8a97a8; --accent: #f5a623; --accent2: #3aa0ff;
    --danger: #ff5a5a; --ok: #37c871;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 800; }
  header .logo { width: 26px; height: 26px; border-radius: 6px; flex: none; }
  header .status { font-size: 13px; color: var(--muted); margin-left: auto; }
  header .status.ok { color: var(--ok); }
  header .status.err { color: var(--danger); }
  .tabs { display: flex; gap: 8px; }
  .tab {
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px;
  }
  .tab.on { background: var(--accent); color: #1a1205; border-color: var(--accent); }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .scopebar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 700;
  }
  .chip.on { background: var(--accent2); color: #04121f; border-color: var(--accent2); }
  .tasktools { display: flex; gap: 8px; margin-bottom: 16px; }
  .tasktools .btn.on { background: var(--accent, #2f7dff); color: #fff; border-color: var(--accent, #2f7dff); }
  .catblock { margin-bottom: 30px; }
  #content { padding-bottom: 32px; }
  .donesection { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 20px; }
  .catblock h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--txt); font-weight: 800; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
  td input, td textarea, td select {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 13px; resize: vertical;
  }
  td.num input { text-align: right; }
  td.chk { text-align: center; }
  td.act { white-space: nowrap; }
  .btn {
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); }
  .btn.danger { background: transparent; color: var(--danger); border-color: transparent; padding: 6px 8px; }
  .btn.add { color: var(--accent2); border-color: var(--accent2); background: transparent; margin-top: 8px; }
  .rowactions { display: flex; gap: 10px; align-items: center; margin: 18px 0 6px; }
  .rowactions .spacer { flex: 1; }
  .savebar {
    position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px 20px; display: flex; gap: 12px; align-items: center; margin: 0 -20px -20px;
  }
  .savebar .msg { font-size: 13px; color: var(--muted); }
  .savebar .msg.ok { color: var(--ok); }
  .savebar .msg.err { color: var(--danger); }
  .dirty { color: var(--accent); font-weight: 700; }
  .colid { width: 90px; }
  .colsearch { display: none; }
  .colnum { width: 90px; }
  .colcat { width: 130px; }
  .coltier { width: 110px; }
  .colimg { width: 70px; text-align: center; }
  .colimg .thumb { max-width: 56px; max-height: 42px; border-radius: 4px; vertical-align: middle; }
  .colimg .imgwarn { color: #c0392b; font-size: 11px; }
  .colchk { width: 60px; }
  .colact { width: 190px; white-space: nowrap; }
  .btn.move { padding: 5px 7px; color: var(--muted); background: transparent; border-color: transparent; }
  .btn.move:hover:not([disabled]) { color: var(--accent2); border-color: var(--accent2); }
  .btn.move[disabled] { opacity: .25; cursor: default; }
  .btn.arch { padding: 4px 9px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .btn.arch:hover { color: var(--txt); border-color: var(--accent); }
  .colwhy { width: 280px; }
  .colwhy textarea { min-height: 72px; line-height: 1.4; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--txt); }
  th.sortable .arrow { color: var(--accent); font-weight: 700; }
  a { color: var(--accent2); }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  /* Tasks board */
  .grouphdr { display: flex; align-items: center; gap: 9px; }
  .grouphdr.collapser { cursor: pointer; user-select: none; }
  .grouphdr.collapser:hover { color: var(--accent); }
  .grouphdr .caret { color: var(--muted); font-size: 20px; width: 22px; display: inline-block; }
  .catmove { display: inline-flex; gap: 4px; margin-left: 8px; }
  .catmove .btn.move { padding: 2px 7px; font-size: 12px; }
  .taskfilter { display: flex; gap: 8px; align-items: center; margin: 4px 0 14px; }
  .btn.mineonly.on { background: var(--accent); color: #1a1205; border-color: var(--accent); }
  .taskfilter .minesel { padding: 7px 10px; border-radius: 8px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--txt); font-weight: 700; font-size: 13px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
  .colowner { width: 130px; }
  .colpri { width: 120px; }
  .coldue { width: 160px; }
  .colfiles { width: 180px; }
  .files { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .filechip { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.06);
    border: 1px solid var(--line, #333); border-radius: 6px; padding: 2px 6px; font-size: 12px; max-width: 160px; }
  .filechip a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
  .filechip .filex { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0; }
  .filechip .filex:hover { color: #ff5a5a; }
  .btn.attach { cursor: pointer; padding: 3px 9px; font-weight: 800; }
  .coldue input[type="date"] { cursor: pointer; }
  .coldue input[type="date"]::-webkit-calendar-picker-indicator {
    cursor: pointer; opacity: 1; font-size: 1.15em;
    filter: invert(48%) sepia(89%) saturate(2000%) hue-rotate(185deg);
  }
  .colstatus { width: 190px; }
  td select.statussel { font-weight: 800; }
  td select.statussel { -webkit-appearance: none; appearance: none; border-radius: 6px; text-align: center; }
  td select.status-none { color: #cfd4db; background: #3a3f47; border-color: #4a505a; }
  td select.status-not_started { color: #f3f4f6; background: #6b7280; border-color: #565d69; }
  td select.status-on_track { color: #eafff2; background: #2ecc71; border-color: #29b866; }
  td select.status-stuck { color: #fff0ef; background: #e74c3c; border-color: #d13b2c; }
  td select.status-ready { color: #2b1a00; background: #f5a623; border-color: #dc9313; }
  td select.status-done { color: #eaf4ff; background: #3b9dff; border-color: #2f88e6; }
  .colnotes { width: 640px; }
  .colnotes textarea { min-height: 46px; line-height: 1.4; }
  .colcat2 { width: 150px; }
  tr.taskdone td input, tr.taskdone td textarea, tr.taskdone td select { opacity: .5; }
  tr.taskdone td textarea[data-f="notes"] { text-decoration: line-through; }
  /* Note column + modal */
  .colnote { width: 74px; text-align: center; }
  .notebtn { cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 9px; font-size: 15px; color: var(--muted); position: relative; }
  .notebtn:hover { border-color: var(--accent); color: var(--txt); }
  .notebtn.has { color: var(--accent); border-color: var(--accent); background: rgba(245,166,35,.14); }
  .notebtn .badge { position: absolute; top: -6px; right: -6px; background: var(--accent); color: #1a1205;
    border-radius: 999px; min-width: 16px; height: 16px; padding: 0 3px; font-size: 10px; line-height: 16px; font-weight: 800; }
  #notemodal { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.62);
    display: flex; align-items: center; justify-content: center; padding: 20px; }
  #notemodal .nbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column; padding: 20px; }
  #notemodal .nhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #notemodal .nhead h3 { margin: 0; font-size: 17px; }
  #notemodal .nx { background: none; border: none; color: var(--muted); font-size: 19px; cursor: pointer; line-height: 1; }
  #notemodal .nx:hover { color: var(--txt); }
  #note-text { width: 100%; min-height: 220px; resize: vertical; background: var(--panel2);
    border: 1px solid var(--line); color: var(--txt); border-radius: 9px; padding: 12px; font: inherit; line-height: 1.5; }
  #notemodal .nfiles { margin-top: 16px; }
  #notemodal .nfiles .lbl { font-size: 12px; color: var(--muted); margin-bottom: 7px; font-weight: 700; }
  #notemodal .nfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
  #notemodal .nfoot .msg { font-size: 12px; color: var(--muted); }
  #gate {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #gate .box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px; width: 100%; max-width: 340px; text-align: center;
  }
  #gate h2 { margin: 0 0 6px; font-size: 18px; }
  #gate p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  #gate input {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 9px; padding: 11px 12px; font: inherit; font-size: 15px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; background: var(--accent); color: #1a1205; border: none;
    border-radius: 9px; padding: 11px; font: inherit; font-weight: 800; cursor: pointer;
  }
  #gate .err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 10px; }
  body.locked { overflow: hidden; }
</style>
</head>

<div id="gate">
  <div class="box">
    <h2>Trans American Trail</h2>

</div>
<header>

<main>

    <button class="btn" id="reload">Reload</button>
    <span class="msg" id="msg"></span>
  </div>
</main>

<div id="notemodal" style="display:none">
  <div class="nbox">
    <div class="nhead">
      <h3 id="note-title">Note</h3>

    <div class="nfiles">

    <div class="nfoot">
      <span class="msg" id="note-msg"></span>
      <button class="btn primary" id="note-save">Save note</button>
    </div>
  </div>
</div>

":"Interlocks seamlessly with their heavy-duty crash bar ecosystem. : If you have a DCT bike but added the optional accessory foot lever, many skid plates (including AltRider and SW-MOTECH) will not fit because they block the lever mechanism.","p":null,"t":"rec","u":"https://west.outbackmotortek.us/product/honda-africa-twin-crf1000l-skid-plate/","img":1},{"b":"africa_twin","i":"SW-Motech  Skid Plate","w":"Extra thick 5 mm aluminum base layer for straight impacts.","p":null,"t":"rec","u":"https://sw-motech.us/en-us/search?q=african+twin+skid+plate","img":1},{"b":"africa_twin","i":"Tusk Quiet Glide Skid Plate","w":"Heavy plastic overlay slides perfectly over logs and boulders.","p":null,"t":"rec","u":"https://www.amazon.com/TUSK-Quiet-Adventure-Africa-CRF1100L/dp/B0DNQVN439/ref=sr_1_4?crid=2YTGRPSN1J57&dib=eyJ2IjoiMSJ9.3LJPMZn_FYI7y6ET4E1jhnToq-zrhrHFoCoqFKLa4F2nLUy6naFAcqmQabrS4kimoKtsIfR_qcaTcaxhyXnUNBLjz-4y52g0U2OxGb_OrgDqwS3YkZf0yPRDE1CytT6599TKKv8O0caYTameWCu6V2-DaYLC1TEf8i4i6P7_-42k6crpQHcmaY2xYS4cHCWB1aK0W3LsITyHCqVW9Ctzagzn83f2XMw_VM5oSE3TcFmsngZiNUSLmzytJObA788-r5MDjeaZ-ReVtB37W4VC1YyoQKc6ara3Glrp2CxWB3Q.Pw7U1Y4nvj5AdOtoSAja8vetWaxY-J2YY0xcnxh3B_Q&dib_tag=se&keywords=africa+twin+skid+plate&qid=1787243804&sprefix=africa+twin+skid+plate%2Caps%2C237&sr=8-4","img":1},{"b":"beta_500rrs","i":"Acerbis / aftermarket 3+ gal tank","w":"Like its KTM rival, the Beta's small stock tank can't reach across the West. A bigger tank is the essential first TAT upgrade.","p":null,"t":"must","u":"","img":0},{"b":"beta_500rrs","i":"Touring seat","w":"The thin enduro seat punishes long days. A wider, firmer touring seat is the top comfort upgrade for big-mileage trail riding.","p":null,"t":"must","u":"","img":0},{"b":"beta_500rrs","i":"Rekluse auto-clutch","w":"Beta's hydraulic clutch is good, but an auto-clutch still kills stalls on steep technical climbs and saves your hand on long days.","p":null,"t":"nice","u":"","img":0},{"b":"beta_500rrs","i":"Taller gearing (front sprocket)","w":"The Beta is happier than the KTM on road but still buzzy. Taller gearing smooths the highway transfers between trail sections.","p":null,"t":"nice","u":"","img":0},{"b":"bmw1300gs","i":"Crash bars (upper + lower)","w":"Drops on a bike this heavy are inevitable and costly. Full crash bars protect the cylinders, tank, and bodywork so a tip-over isn't trip-ending.","p":null,"t":"must","u":"","img":0},{"b":"bmw1300gs","i":"Full skid plate + header guard","w":"500+ lb over rocks demands real underbody armor. The boxer's exposed cylinders and sump need a proper bash plate.","p":null,"t":"must","u":"","img":0},{"b":"bmw1300gs","i":"Knobby-capable tires + tubeless setup","w":"The stock road-biased tires are out of their depth on TAT dirt. A proper 50/50 or knobby transforms its off-road grip.","p":null,"t":"must","u":"","img":0},{"b":"bmw1300gs","i":"Wide pegs + suspension setup","w":"Managing this weight in dirt is all about control. Wide pegs plus suspension dialed for your load make the technical days far less brutal.","p":null,"t":"nice","u":"","img":0},{"b":"crf300l","i":"Camel ADV / Bulletproof skid plate + guards","w":"The exposed cases and header need protection on rocky trail. A proper bash plate and header guard prevent trip-ending damage.","p":null,"t":"must","u":"","img":0},{"b":"crf300l","i":"Fork springs + rear shock upgrade","w":"The budget suspension bottoms easily once you add luggage and hit rough terrain. Stiffer springs make it composed and confident.","p":null,"t":"must","u":"","img":0},{"b":"crf300l","i":"IMS / Camel ADV / Acerbis 3+ gal tank","w":"The stock 2.0-gal tank barely clears 100 miles. A bigger tank is the CRF300L's single most important TAT upgrade for the Western gaps.","p":null,"t":"must","u":"https://www.rockymountainatvmc.com/parts/acerbis-fuel-tank-p?v=22275","img":1},{"b":"crf300l","i":"Seat Concepts seat","w":"The stock CRF300L plank punishes you after an hour. A wider, better-foam seat is the difference between finishing the day comfortable and counting the miles to the next stop.","p":null,"t":"must","u":"https://www.rockymountainatvmc.com/parts/seat-concepts-complete-seat-p?v=22275","img":1},{"b":"crf300l","i":"Acerbis X-Power case covers","w":"Bolt-on plastic covers that shield the crankcase and ignition/clutch covers from rock strikes and log rub. Cheap insurance against a cracked case dumping oil in the middle of nowhere.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/acerbis-x-power-crankcase-and-ignition-clutch-cover-kit-p?v=22275","img":1},{"b":"crf300l","i":"IMS Rally foot pegs","w":"Wide rally-style platform with aggressive cleats for max grip standing on the pegs all day. A comfort and control upgrade over the skinny stock pegs when you're loaded and tired.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/ims-rally-foot-pegs-p?v=22275","img":1},{"b":"crf300l","i":"Motion Pro Pro Plug socket","w":"Compact spark plug socket that fits the CRF's tight plug well and packs flat in the tool roll. One of those tiny tools you only miss when you're stranded needing it.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/motion-pro-pro-plug-socket-p?v=22275","img":1},{"b":"crf300l","i":"Motion Pro T-6 combo lever set","w":"Tire iron and axle wrench combined in one tool, so you carry less and lose fewer pieces on the trail. A refined backup to the aluminum irons for stubborn beads.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/motion-pro-t-6-combo-lever-p?v=22275","img":1},{"b":"crf300l","i":"Taller gearing (front sprocket)","w":"The little single spins hard on slab. One tooth up front drops highway RPM and vibration on the road transfers.","p":null,"t":"nice","u":"","img":0},{"b":"crf300l","i":"Tusk Axis folding lever set","w":"Folding clutch and brake levers hinge away in a tip-over instead of snapping. On a solo TAT run a broken lever can strand you, so a folding set plus the handguards is cheap insurance.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/tusk-axis-folding-lever-set-p?v=22275","img":1},{"b":"crf300l","i":"Tusk folding shift lever","w":"A spring-loaded folding tip gives way in a tip-over instead of bending or snapping. Cheap peace of mind for the rocky, drop-prone stuff.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/tusk-folding-shift-lever-p?v=22275","img":1},{"b":"crf300l","i":"Yoshimura fender eliminator kit V2","w":"Ditches the heavy stock rear fender and license bracket for a clean, tucked tail that won't catch mud and roost. A tidy weight-saving cosmetic tweak that also survives tip-overs better.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/yoshimura-fender-eliminator-kit-v2-p?v=22275","img":1},{"b":"crf300l","i":"Acerbis plastic offroad skid plate","w":"Lightweight molded plastic bash plate that shrugs off rock strikes and flexes instead of denting. A cheaper, lighter alternative to aluminum that still shields the cases and header on rough trail.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/acerbis-plastic-offroad-skid-plate-p?v=22275","img":1},{"b":"crf300l","i":"Barkbusters VPS handguard kit","w":"Premium alternative to the Tusk guards. The alloy backbone takes a hard hit and the VPS plastic shell blocks wind and roost. A proven, near-bulletproof setup for the long haul.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/barkbusters-vps-two-point-mounted-handguard-kit-p?v=22275","img":1},{"b":"crf300l","i":"DoubleTake adventure mirror kit","w":"Fold-away, near-indestructible mirrors on a ball mount. Tuck them in for tight singletrack, flip them out for slab, and a drop won't shatter them like stock glass.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/double-take-adventure-mirror-kit-p?v=22275","img":1},{"b":"crf300l","i":"IMS SuperStock foot pegs","w":"Wider, more aggressive platform than the skinny stock CRF pegs. Better grip and far less foot fatigue standing through the rough stuff all day.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/ims-superstock-foot-pegs-p?v=22275","img":1},{"b":"crf300l","i":"Race Tech G3-S rear shock","w":"A proper internal-reservoir rear shock transforms the CRF300L's budget rear end. Sprung and valved for your weight plus luggage, it stops the wallowing and holds a line through the rough at speed.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/race-tech-adv-shock-p?v=22275","img":1},{"b":"crf300l","i":"Tusk 2\" pivoting bar risers","w":"Raise and pivot the bars for a natural standing position. Huge fatigue reducer for a tall rider spending all day on the pegs, and the pivot lets you dial the reach.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-2%22-pivoting-bar-risers-p?v=22275","img":1},{"b":"crf300l","i":"Tusk D-Flex Pro handguards","w":"Wrap-around aluminum-backbone guards protect levers and hands from rocks, brush, and cold wind. A tip-over won't snap your clutch lever and end the trip.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-d-flex-pro-adventure-handguards-p?v=22275","img":1},{"b":"crf300l","i":"Tusk First Line air filter","w":"A quality replacement filter keeps trail dust out of the little single's intake. Cheap insurance for a motor that lives in dust clouds all day, and a spare is easy to pack.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-first-line-air-filter-p?v=22275","img":1},{"b":"crf300l","i":"Tusk aluminum skid plate","w":"A budget-friendly alternative to the Camel ADV/Bulletproof plate. Wraps the cases and header from rock strikes and covers the vulnerable underside on rough trail.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-aluminum-skid-plate-p?v=22275","img":1},{"b":"crf300l","i":"Tusk aluminum tire irons","w":"You will fix a flat on the TAT. Lightweight, strong irons that actually break a stubborn dual-sport bead without folding. Pack a set with your tube and patches.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-aluminum-tire-iron-p?v=22275","img":1},{"b":"crf300l","i":"Tusk motorcycle axle tool kit","w":"The exact wrenches to pull both wheels roadside, packed compact. Without them a flat repair in the middle of nowhere turns into a very long day. Pairs with the tire irons.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-motorcycle-axle-tool-kit-p?v=22275","img":1},{"b":"crf300l","i":"Tusk rear rack","w":"The CRF300L's small subframe rack maxes out fast. A stronger rear rack gives you a real base for a top case or dry bag and anchors soft luggage for the long haul.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-top-rack-p?v=22275","img":1},{"b":"crf300l_rally","i":"Fork springs + rear shock upgrade","w":"The Rally is heavier than the L thanks to the fairing and tank, so the soft stock suspension sags even more when loaded. Stiffer springs fix it.","p":null,"t":"must","u":"","img":0},{"b":"crf300l_rally","i":"Skid plate + engine guards","w":"The fairing hides but doesn't protect the cases. A real bash plate and header guard keep rocks out of the engine.","p":null,"t":"must","u":"","img":0},{"b":"crf300l_rally","i":"Comfort seat","w":"The Rally's stock seat is thin for its touring intent. A Seat Concepts kit makes the long fuel-range days actually enjoyable.","p":null,"t":"nice","u":"","img":0},{"b":"crf300l_rally","i":"Taller gearing (front sprocket)","w":"Same buzzy little single as the L. A tooth up front calms highway RPM on the slab sections between trails.","p":null,"t":"nice","u":"","img":0},{"b":"crf450rl","i":"IMS / Acerbis oversize tank","w":"The stock 2.0-gal tank is the 450RL's biggest TAT liability. A larger tank is essential to clear the long Western fuel gaps.","p":null,"t":"must","u":"","img":0},{"b":"crf450rl","i":"Taller gearing (front/rear sprocket)","w":"Geared low for closed-course use, it buzzes hard on the slab. Taller gearing drops highway RPM and calms the vibration on road transfers.","p":null,"t":"must","u":"","img":0},{"b":"crf450rl","i":"Comfort seat","w":"The stock plank is fine for a moto but brutal on long days. A Seat Concepts kit makes the fuel-range days livable.","p":null,"t":"nice","u":"","img":0},{"b":"crf450rl","i":"ECU flash / fuel remap","w":"The stock EPA tune runs lean and abrupt off idle. A flash smooths the low-end and wakes up the throttle for loaded trail riding.","p":null,"t":"rec","u":"","img":0},{"b":"desertx","i":"Full aluminum skid plate","w":"The stock guard is light. A full bash plate protects the sump and header once you point 490 lb over rocks.","p":null,"t":"must","u":"","img":0},{"b":"desertx","i":"Auxiliary fuel / larger tank","w":"The stock 5.5-gal tank is decent but a rear aux tank is a popular DesertX mod for the long Western fuel gaps.","p":null,"t":"nice","u":"","img":0},{"b":"desertx","i":"Crash bars / engine guards","w":"Drops are inevitable at this weight. Crash bars protect the radiator, tank, and bodywork on the technical days.","p":null,"t":"nice","u":"","img":0},{"b":"desertx","i":"Suspension setup (springs for load)","w":"The stock suspension is capable but soft once fully loaded. Springs matched to your weight keep it composed on rough two-track.","p":null,"t":"rec","u":"","img":0},{"b":"dr350","i":"Carb / jetting refresh","w":"These are decades old and often run rich, lean, or gummed. A clean and rejet restores reliable starting and power at altitude.","p":null,"t":"must","u":"","img":0},{"b":"dr350","i":"IMS / Clarke larger tank","w":"The DR350's small stock tank is its main range limiter. A bigger tank is the first upgrade to make the Western gaps manageable.","p":null,"t":"must","u":"","img":0},{"b":"dr350","i":"Suspension refresh / respring","w":"Thirty-year-old fork seals and tired springs sap control. Fresh oil, seals, and springs for your weight bring the DR350 back to life.","p":null,"t":"must","u":"","img":0},{"b":"dr350","i":"Electrical / stator upgrade","w":"The old charging system barely runs stock lights, let alone GPS. A stator upgrade keeps modern electronics alive on the trail.","p":null,"t":"nice","u":"","img":0},{"b":"dr650","i":"Acerbis large fuel tank","w":"The stock 3.4-gal tank is the DR650's main TAT weakness. A big Acerbis, Safari, or IMS tank pushes range well past the Western fuel gaps.","p":null,"t":"must","u":"https://www.rockymountainatvmc.com/parts/acerbis-fuel-tank-p?v=13210","img":1},{"b":"dr650","i":"Seat Concepts seat","w":"The stock plank ruins long days. A Seat Concepts foam-and-cover kit is the single best comfort upgrade for the DR650.","p":null,"t":"must","u":"https://www.rockymountainatvmc.com/parts/seat-concepts-complete-seat-p?v=16848","img":1},{"b":"dr650","i":"Antigravity Re-Start lithium battery","w":"Half the weight of the stock lead-acid, and the built-in Re-Start reserve self-jumps the bike if you drain it, so a dead battery in the middle of nowhere isn't trip-ending.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/antigravity-batteries-re-start-lithium-battery-p?v=16848","img":1},{"b":"dr650","i":"Bar risers","w":"Raising and rolling the bars makes standing on the pegs comfortable for tall riders, which you'll do for hours on the trail.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/tusk-2%22-pivoting-bar-risers-p?v=16848","img":1},{"b":"dr650","i":"DoubleTake adventure mirror kit","w":"Fold-away CNC mirrors on a ball-and-socket mount take the trail beatings that snap stock stalks, and tuck in for tight singletrack.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/double-take-adventure-mirror-kit-p?v=16848","img":1},{"b":"dr650","i":"Motion Pro T-6 combo lever","w":"One tool that's a tire iron plus the common axle/wrench sizes. Cuts the roadside tire-repair kit down to a single compact lever.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/motion-pro-t-6-combo-lever-p?v=16848","img":1},{"b":"dr650","i":"Acerbis skid plate","w":"The DR650's cases and frame rails hang low. A skid plate takes the rock and log strikes that would otherwise crack a case and end the trip.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/acerbis-plastic-offroad-skid-plate-p?v=16848","img":1},{"b":"dr650","i":"IMS Pro Series foot pegs","w":"Wide, aggressive-cleat pegs give way more grip and a stable platform for standing all day. The narrow stock DR650 pegs are miserable off-road by comparison.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/ims-pro-series-foot-pegs-p?v=16848","img":1},{"b":"dr650","i":"Tusk D-Flex Pro handguards","w":"Wrap-around aluminum-backbone handguards protect levers, hands, and brake/clutch reservoirs in the inevitable tip-overs and brush.","p":90,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-d-flex-pro-adventure-handguards-p?v=16848","img":1},{"b":"dr650","i":"Tusk First Line air filter","w":"Western sections of the TAT are pure dust. A fresh high-flow filter (and a spare to swap mid-trip) keeps grit out of the big single's top end.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-first-line-air-filter-p?v=16848","img":1},{"b":"dr650","i":"Tusk aluminum tire irons","w":"Roadside tube changes are a fact of TAT life. Lightweight aluminum tire irons pack small and make breaking a bead in the dirt a lot less miserable.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-aluminum-tire-iron-p?v=16848","img":1},{"b":"dr650","i":"Tusk racer axle wrench","w":"Pulls the front and rear axles for trailside tire and tube work without dragging a full socket set across the country.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-racer-axle-wrench-p?v=16848","img":1},{"b":"dr650","i":"Tusk rear rack","w":"A solid steel rear rack is the mounting base for a top case or dry bag, and it stiffens the subframe for loaded trail miles.","p":80,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-top-rack-p?v=16848","img":1},{"b":"drz400","i":"IMS / Acerbis 3.9-gal tank","w":"The stock 2.6-gal tank is the DR-Z's single biggest TAT liability. A larger tank turns the Western fuel gaps from white-knuckle into routine.","p":null,"t":"must","u":"https://www.rockymountainatvmc.com/parts/ims-fuel-tank-p?v=17084","img":1},{"b":"drz400","i":"Seat Concepts seat","w":"The stock DR-Z plank ruins long days. A Seat Concepts foam-and-cover kit is the single best comfort upgrade for multi-hour trail days.","p":null,"t":"must","u":"https://www.rockymountainatvmc.com/parts/seat-concepts-complete-seat-p?v=17084","img":1},{"b":"drz400","i":"3x3 airbox mod + JD jet kit","w":"Opening the airbox and rejetting is the classic DR-Z wake-up. More usable power for slab, altitude, and loaded climbs.","p":null,"t":"nice","u":"","img":0},{"b":"drz400","i":"Acerbis X-Power case covers","w":"Plastic covers over the ignition and clutch cases take the hit from rocks and tip-overs, so a fall doesn't crack a case and strand you. Cheap insurance against a trip-ending leak.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/acerbis-x-power-crankcase-and-ignition-clutch-cover-kit-p?v=17084","img":1},{"b":"drz400","i":"DeVol rear disc guard","w":"A stick or rock through the rear rotor ends your ride. The DeVol guard shields the rear disc from trail debris on the rough two-track out West.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/devol-rear-disc-guard-p?v=17084","img":1},{"b":"drz400","i":"DoubleTake adventure mirror kit","w":"Fold-away CNC mirrors on a ball-and-socket mount take the trail beatings that snap stock stalks, and tuck in for tight singletrack.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/double-take-adventure-mirror-kit-p?v=17084","img":1},{"b":"drz400","i":"Motion Pro Pro Plug spark plug socket","w":"A slim, rubber-lined plug socket that fits the DR-Z's tight plug well and holds the plug so you can swap it trailside without dropping it into the engine.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/motion-pro-pro-plug-socket-p?v=17084","img":1},{"b":"drz400","i":"Motion Pro T-6 combo lever set","w":"Tire irons plus the common axle/wrench sizes in one set. Covers most roadside tire and axle work without dragging a full socket set across the country.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/motion-pro-t-6-combo-lever-set-p?v=17084","img":1},{"b":"drz400","i":"Rox Speed FX 2\" bar risers","w":"Raising the bars makes standing on the pegs comfortable for tall riders, which you'll do for hours on the trail.","p":null,"t":"nice","u":"https://www.rockymountainatvmc.com/parts/rox-speed-fx-2%22-handlebar-risers-p?v=17084","img":1},{"b":"drz400","i":"Taller gearing","w":"The DR-Z buzzes at highway speed. A tooth or two taller on the countershaft calms the road transfers between trail sections.","p":null,"t":"nice","u":"","img":0},{"b":"drz400","i":"DeVol skid plate","w":"The heavy-duty alternative to the Tusk plate. DeVol's thicker aluminum wraps the frame rails and cases for the rockiest sections out West. Pick this or the Tusk, not both.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/devol-skid-plate-p?v=17084","img":1},{"b":"drz400","i":"IMS Pro Series foot pegs","w":"Wider, more aggressive platform than the narrow stock DR-Z pegs. Better grip and less foot fatigue standing on the pegs all day across rough terrain.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/ims-pro-series-foot-pegs-p?v=17084","img":1},{"b":"drz400","i":"Tusk D-Flex Pro handguards","w":"Wrap-around aluminum-backbone handguards protect levers, hands, and brake/clutch reservoirs in the inevitable tip-overs and brush.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-d-flex-pro-adventure-handguards-p?v=17084","img":1},{"b":"drz400","i":"Tusk First Line air filter","w":"The Western TAT is nonstop dust. A fresh high-flow filter (plus a spare to swap mid-trip) keeps grit out of the DR-Z's top end.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-first-line-air-filter-p?v=17084","img":1},{"b":"drz400","i":"Tusk aluminum skid plate","w":"The DR-Z's cases and frame rails hang low. An aluminum skid plate takes the rock and log strikes that would otherwise crack a case and end the trip.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-aluminum-skid-plate-p?v=17084","img":1},{"b":"drz400","i":"Tusk aluminum tire irons","w":"Roadside tube changes are a fact of TAT life. Lightweight aluminum tire irons pack small and make breaking a bead in the dirt a lot less miserable.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-aluminum-tire-iron-p?v=17084","img":1},{"b":"drz400","i":"Tusk folding shift lever","w":"The stock shifter bends or snaps in a tip-over and can strand you. A spring-loaded folding lever gives on impact instead of breaking.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-folding-shift-lever-p?v=17084","img":1},{"b":"drz400","i":"Tusk rear rack","w":"A solid rack is the mounting base for a top case or dry bag and stiffens the subframe for loaded trail miles.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/tusk-top-rack-p?v=17084","img":1},{"b":"f850gs","i":"Full skid plate + engine guards","w":"The GS's low-slung engine and exhaust need real protection once you take 450-500 lb off pavement. A full bash plate is non-negotiable.","p":null,"t":"must","u":"","img":0},{"b":"f850gs","i":"Suspension upgrade / respring","w":"The stock suspension sags and wallows fully loaded for a trip. Heavier springs and revalve keep the heavy GS planted on rough dirt.","p":null,"t":"must","u":"","img":0},{"b":"f850gs","i":"Crash bars","w":"Drops on a bike this heavy are expensive. Upper and lower crash bars protect the tank, radiator, and bodywork on the technical sections.","p":null,"t":"nice","u":"","img":0},{"b":"f850gs","i":"Wide off-road footpegs","w":"The narrow stock pegs make standing tiring on a heavy bike. Wide pegs give the leverage and control you need to manage the weight in dirt.","p":null,"t":"nice","u":"","img":0},{"b":"f900gs","i":"Full aluminum skid plate","w":"The stock guard is minimal. A full bash plate protects the sump and header once you point 480 lb over rocks.","p":null,"t":"must","u":"","img":0},{"b":"f900gs","i":"Comfort / rally seat","w":"The stock seat wears thin on long days. A comfort seat makes the long fuel-range days livable.","p":null,"t":"nice","u":"","img":0},{"b":"f900gs","i":"Crash bars / engine guards","w":"Drops are inevitable at this weight. Crash bars protect the radiator, tank, and plastics on the technical days.","p":null,"t":"nice","u":"","img":0},{"b":"f900gs","i":"Suspension setup (springs for load)","w":"The stock suspension sags loaded with luggage and fuel. Springs matched to your weight keep it composed on rough two-track.","p":null,"t":"rec","u":"","img":0},{"b":"himalayan","i":"Fork springs / suspension upgrade","w":"The soft budget suspension bottoms when loaded and pushed. Firmer springs make the Himalayan far more composed on rough two-track.","p":null,"t":"must","u":"","img":0},{"b":"himalayan","i":"Skid plate + engine guards","w":"The stock plate is thin and the header hangs exposed. A proper bash plate protects the low-slung engine on rocky trail.","p":null,"t":"must","u":"","img":0},{"b":"himalayan","i":"Upgraded tires","w":"The stock tires are the Himalayan's weak link in dirt. A tougher 50/50 or knobby set unlocks the grip its low-speed torque deserves.","p":null,"t":"must","u":"","img":0},{"b":"himalayan","i":"Handguards + engine crash bars","w":"The Himalayan's exposed sump and levers take the hit in low-speed tip-overs. Crash bars and handguards keep a drop from stranding you.","p":null,"t":"nice","u":"","img":0},{"b":"husky701","i":"Camel ADV / Safari auxiliary tank","w":"Like the 690, the 701 wants more fuel for the West. An auxiliary or larger tank turns range from a limit into a non-issue.","p":null,"t":"must","u":"","img":0},{"b":"husky701","i":"Suspension respring / revalve","w":"The 701 shares the 690's tall, light chassis that gets nervous loaded. Springs and a revalve for your weight settle it on rough terrain.","p":null,"t":"must","u":"","img":0},{"b":"husky701","i":"Rekluse or upgraded clutch","w":"The big single stalls in slow technical going. An auto-clutch keeps momentum on steep, rocky, loaded climbs.","p":null,"t":"nice","u":"","img":0},{"b":"husky701","i":"Scotts steering damper","w":"The quick front end deflects on rocks and washboard at speed. A damper adds stability and confidence on fast dirt.","p":null,"t":"nice","u":"","img":0},{"b":"ibex450","i":"Crash bars and skid plate","w":"Protecting the radiator and cases on a value bike keeps a tip-over from becoming an expensive part you have to import.","p":null,"t":"must","u":"","img":0},{"b":"ibex450","i":"Seat upgrade","w":"The stock seat is fine for a lunch ride and punishing for a TAT day. A better foam-and-cover kit is the top comfort win.","p":null,"t":"nice","u":"","img":0},{"b":"ibex450","i":"Tubeless tire repair kit","w":"The tubeless wheels are a real advantage on trail. A plug kit and mini compressor let you fix most punctures without pulling a wheel.","p":null,"t":"nice","u":"","img":0},{"b":"klr650","i":"Comfort seat","w":"The stock KLR seat is a legendary torture device. A Seat Concepts or wider seat is the top comfort upgrade for its long-range mission.","p":null,"t":"must","u":"","img":0},{"b":"klr650","i":"Doohickey (balancer chain tensioner)","w":"The pre-2022 KLR's balancer tensioner ('doohickey') is a notorious failure point. Swapping in an aftermarket one is the classic must-do KLR fix.","p":null,"t":"must","u":"","img":0},{"b":"klr650","i":"Suspension respring / revalve","w":"The KLR is heavy and its stock suspension is soft and wallowy loaded. Progressive springs and a revalve transform the handling on rough roads.","p":null,"t":"must","u":"","img":0},{"b":"klr650","i":"Wider footpegs + bar risers","w":"The narrow stock pegs and low bars make standing miserable on a tall, heavy bike. Wide pegs and risers make trail control far easier.","p":null,"t":"nice","u":"","img":0},{"b":"kove450rally","i":"Spare-parts kit","w":"Dealer coverage is thin. Carrying levers, a shifter, cables, and common consumables keeps a remote breakdown from ending the trip.","p":null,"t":"must","u":"","img":0},{"b":"kove450rally","i":"Skid plate reinforcement","w":"The rally chassis sits low with a big tank. A proper full skid plate protects the cases and lines on rocky two-track.","p":null,"t":"nice","u":"","img":0},{"b":"kove450rally","i":"Suspension revalve / respring","w":"The stock rally suspension is capable but generic. A revalve and respring for your weight transforms high-speed dirt confidence on the fast Western sections.","p":null,"t":"nice","u":"","img":0},{"b":"ktm1290adv","i":"Crash bars (upper + lower)","w":"Drops on a bike this heavy are inevitable and expensive. Full crash bars protect the tank, plastics, and engine so a tip-over isn't trip-ending.","p":null,"t":"must","u":"","img":0},{"b":"ktm1290adv","i":"Full skid plate + header guard","w":"550 lb over rocks demands serious armor. The V-twin's exposed sump and header need a proper bash plate to survive the trail.","p":null,"t":"must","u":"","img":0},{"b":"ktm1290adv","i":"Knobby-capable tires + tubeless setup","w":"The stock road-biased tires can't handle loaded TAT dirt. A 50/50 or knobby is the single biggest off-road improvement.","p":null,"t":"must","u":"","img":0},{"b":"ktm1290adv","i":"Wide pegs + suspension setup","w":"Controlling this weight in dirt is everything. Wide pegs plus suspension dialed for your load make the technical days far less brutal.","p":null,"t":"nice","u":"","img":0},{"b":"ktm690","i":"Safari / auxiliary fuel tank","w":"The 690's ~3.7-gal tank is decent but tight for the biggest Western gaps. An auxiliary or larger Safari tank buys real peace of mind.","p":null,"t":"must","u":"","img":0},{"b":"ktm690","i":"Suspension respring / revalve","w":"The 690 is a big single that gets skittish loaded. Springs and a revalve for your weight plus luggage tame it on rough two-track.","p":null,"t":"must","u":"","img":0},{"b":"ktm690","i":"Rekluse or upgraded clutch","w":"The torquey single stalls easily in slow technical terrain. An auto-clutch keeps you moving on steep, rocky, loaded climbs.","p":null,"t":"nice","u":"","img":0},{"b":"ktm690","i":"Scotts steering damper","w":"The light front end deflects on rocks and washboard at speed. A steering damper adds stability and confidence on fast dirt roads.","p":null,"t":"nice","u":"","img":0},{"b":"ktm790adv","i":"Full aluminum skid plate","w":"The low tank and exposed sump hang right in the rock strike zone. A full bash plate is essential once you point 460 lb over technical ground.","p":null,"t":"must","u":"","img":0},{"b":"ktm790adv","i":"Suspension upgrade (springs / revalve)","w":"The stock WP suspension is soft and underdamped loaded. Heavier springs and a revalve settle it on rough, fast two-track.","p":null,"t":"must","u":"","img":0},{"b":"ktm790adv","i":"Comfort / rally seat","w":"The stock seat wears thin on long days. A comfort seat makes the big fuel range actually usable.","p":null,"t":"nice","u":"","img":0},{"b":"ktm790adv","i":"Crash bars / engine guards","w":"Drops are inevitable at this weight. Crash bars protect the radiator, tank, and plastics on the technical days.","p":null,"t":"nice","u":"","img":0},{"b":"ktm890adv","i":"Full aluminum skid plate","w":"The low tank and sump sit right in the rock strike zone. A full bash plate is essential once you point 455 lb over technical ground.","p":null,"t":"must","u":"","img":0},{"b":"ktm890adv","i":"Suspension upgrade (springs / revalve)","w":"The stock WP suspension is soft and underdamped loaded. Heavier springs and a revalve settle it on rough, fast two-track.","p":null,"t":"must","u":"","img":0},{"b":"ktm890adv","i":"Comfort / rally seat","w":"The stock seat wears thin on long days. A comfort seat makes the big fuel range actually usable.","p":null,"t":"nice","u":"","img":0},{"b":"ktm890adv","i":"Crash bars / engine guards","w":"Drops are inevitable at this weight. Crash bars protect the radiator, tank, and plastics on the technical days.","p":null,"t":"nice","u":"","img":0},{"b":"ktm_exc_350_450","i":"Rade Garage / Acerbis 3+ gal tank","w":"The stock ~2.25-gal tank is the EXC-F's biggest TAT liability. A larger tank or auxiliary cell is the first mod every trail-bound EXC gets.","p":null,"t":"must","u":"","img":0},{"b":"ktm_exc_350_450","i":"Touring seat","w":"Race seats are thin and brutal for all-day riding. A taller touring foam seat makes the long saddle hours survivable.","p":null,"t":"must","u":"","img":0},{"b":"ktm_exc_350_450","i":"Rekluse auto-clutch","w":"Kills stalls on steep, rocky, low-speed climbs and saves your clutch hand over a long day. A favorite on TAT-prepped enduros.","p":null,"t":"nice","u":"","img":0},{"b":"ktm_exc_350_450","i":"Taller gearing (front sprocket)","w":"These race motors scream on slab. Taller gearing calms highway RPM and vibration on the road transfers between trail sections.","p":null,"t":"nice","u":"","img":0},{"b":"ktm_exc_500","i":"Acerbis 3.2 gal fuel tank","w":"Nearly doubles the stock KTM range so you can clear long fuel gaps between TAT towns. Molded to hug the frame, holds ~3.2 gallons, and keeps the standard bodywork lines.","p":406,"t":"must","u":"https://www.rockymountainatvmc.com/parts/acerbis-fuel-tank-p?v=16875","img":1},{"b":"ktm_exc_500","i":"IMS large fuel tank","w":"A proven IMS oversized tank is a clean bolt-on way to add the range the West demands, with a molded shape that keeps the bike slim between your knees.","p":null,"t":"must","u":"https://www.partsgiant.com/p344892-ims-fuel-tank","img":1},{"b":"ktm_exc_500","i":"Seat Concepts comfort seat (tall XL)","w":"Wider, taller foam with a gripper top that ends the stock plank misery on all-day TAT stretches. The tall XL profile also opens up legroom for a taller rider standing on the pegs.","p":360,"t":"must","u":"https://www.rockymountainatvmc.com/parts/seat-concepts-complete-seat-p?v=16875","img":1},{"b":"ktm_exc_500","i":"Skid plate + linkage guard","w":"The exposed cases and linkage need real protection once you load the bike and slow down for technical terrain.","p":null,"t":"must","u":"https://tacomoto.co/products/copy-of-molecule-motorsports-skidplate-for-2023-2024-ktm-husqvarna-gasgas-250-350","img":1},{"b":"ktm_exc_500","i":"Acerbis X-Grip frame guards","w":"Bolt-on frame protectors that stop boots and terrain from chewing up the frame rails, and give your legs extra grip on the bike. Cheap insurance that keeps resale value up.","p":41,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/acerbis-x-grip-frame-guards-p?v=19458","img":1},{"b":"ktm_exc_500","i":"Cycra Ultra Probend handguards","w":"Wrap-around aluminum-backbone handguards protect levers, hands, and the brake and clutch reservoirs in the inevitable tip-overs and brush on technical TAT terrain.","p":null,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/cycra-ultra-probend-hcm-handguard-pack-1-1-8%22-bars-p","img":1},{"b":"ktm_exc_500","i":"Double Take dual sport mirror kit","w":"Folding, adjustable mirrors that flip out of the way for tight trail sections and fold flat for hauling. Ball-and-socket mount survives crashes where rigid mirrors snap. Street-legal visibility for the dual-sport road stretches.","p":72,"t":"rec","u":"https://www.rockymountainatvmc.com/parts/double-take-dual-sport-mirror-kit-p?v=19458","img":1},{"b":"ktm_exc_500","i":"ECU","w":"The GET ECU, is the latest in tech to get the most power out of your motor, and incorporates const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const statusEl = document.getElementById("status");
const contentEl = document.getElementById("content");
const scopebarEl = document.getElementById("scopebar");
const msgEl = document.getElementById("msg");
const hintEl = document.getElementById("hint");

let mode = "tasks";         // "tasks" | "gear" | "upgrades"
let upgradeScope = "universal";
let tierSortDir = 0;        // 0 = none, 1 = asc, -1 = desc
let gearRows = [];          // working copy
let upgradeRows = [];       // working copy (current scope only)
let tasksRows = [];         // working copy (shared task board)
let taskSortByDue = false;   // false = manual order, true = sort each group by due date
let taskSortByOwner = false; // sort each group by assigned owner
let taskMineOnly = false;    // "My Tasks only" filter toggle
let taskOwnerFilter = "";    // whose tasks to show when the filter is on
let taskCollapsed = new Set(); // category keys whose block is collapsed
let pendingFocusId = null;   // after a re-render, focus this row's detail textarea
let removedIds = new Set(); // ids deleted in this session, per table flush
let loadedIds = new Set();  // ids that existed on load (to detect removals)

function uid(prefix) {
  return prefix + "-" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
}
function setStatus(txt, cls) {
  statusEl.textContent = txt;
  statusEl.className = "status" + (cls ? " " + cls : "");
}
function setMsg(txt, cls) {
  msgEl.textContent = txt;
  msgEl.className = "msg" + (cls ? " " + cls : "");
}

// ---------------- GEAR ----------------
async function loadGear() {
  setMsg("");
  const { data, error } = await sb.from("gear").select("*").order("sort_order", { ascending: true });
  if (error) { setStatus("read error", "err"); setMsg(error.message, "err"); return; }
  gearRows = (data || []).map(r => ({
    id: r.id, category: r.category || "gear", name: r.name || "", note: r.note || "",
    price_usd: r.price_usd == null ? 0 : Number(r.price_usd), url: r.url || "", search: r.search || "",
    optional: !!r.optional, specific: !!r.specific, slot: r.slot || "",
  }));
  loadedIds = new Set(gearRows.map(r => r.id));
  removedIds = new Set();
  setStatus("connected · " + gearRows.length + " gear rows", "ok");
  renderGear();
}

function renderGear() {
  scopebarEl.style.display = "none";
  hintEl.textContent = "Edit any cell. Rows save in the order shown (top to bottom). Add rows per category, delete with ✕. Changes push live to phones on Save.";
  const byCat = {};
  KIT_CATEGORIES.forEach(c => byCat[c.id] = []);
  gearRows.forEach(r => { (byCat[r.category] ||= []).push(r); });
  let html = "";
  KIT_CATEGORIES.forEach(cat => {
    const rows = byCat[cat.id] || [];
    html += `<div class="catblock"><h2>${cat.label} (${rows.length})</h2>
      <table><thead><tr>
        <th class="colid">id</th><th>name</th><th>note</th>
        <th class="colnum">price $</th><th>url</th><th class="colsearch">search</th>
        <th class="colchk">opt</th><th class="colchk">spec</th><th class="coltier">slot</th><th class="colact"></th>
      </tr></thead><tbody>`;
    rows.forEach(r => {
      const i = gearRows.indexOf(r);
      html += `<tr>
        <td class="colid"><input value="${esc(r.id)}" data-i="${i}" data-f="id"></td>
        <td><input value="${esc(r.name)}" data-i="${i}" data-f="name"></td>
        <td><textarea rows="2" data-i="${i}" data-f="note">${esc(r.note)}</textarea></td>
        <td class="num colnum"><input type="number" step="1" value="${r.price_usd}" data-i="${i}" data-f="price_usd"></td>
        <td><input value="${esc(r.url)}" data-i="${i}" data-f="url"></td>
        <td class="colsearch"><input value="${esc(r.search)}" data-i="${i}" data-f="search"></td>
        <td class="chk colchk"><input type="checkbox" ${r.optional ? "checked" : ""} data-i="${i}" data-f="optional"></td>
        <td class="chk colchk"><input type="checkbox" ${r.specific ? "checked" : ""} data-i="${i}" data-f="specific"></td>
        <td class="coltier"><input value="${esc(r.slot)}" data-i="${i}" data-f="slot"></td>
        <td class="act colact"><button class="btn danger" data-del="${i}" data-t="gear">✕</button></td>
      </tr>`;
    });
    html += `</tbody></table>
      <button class="btn add" data-add="${cat.id}">+ Add ${cat.label} item</button></div>`;
  });
  contentEl.innerHTML = html;
  wireGearInputs();
}

function wireGearInputs() {
  contentEl.querySelectorAll("input,textarea").forEach(el => {
    el.addEventListener("input", () => {
      const i = +el.dataset.i, f = el.dataset.f;
      if (i == null || !f) return;
      if (f === "optional" || f === "specific") gearRows[i][f] = el.checked;
      else if (f === "price_usd") gearRows[i][f] = Number(el.value) || 0;
      else gearRows[i][f] = el.value;
      markDirty();
    });
  });
  contentEl.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.del;
    const row = gearRows[i];
    if (!confirm("Delete gear row \"" + (row.name || row.id) + "\"?")) return;
    if (loadedIds.has(row.id)) removedIds.add(row.id);
    gearRows.splice(i, 1);
    renderGear(); markDirty();
  }));
  contentEl.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
    const cat = b.dataset.add;
    gearRows.push({ id: uid(cat), category: cat, name: "", note: "", price_usd: 0, url: "", search: "", optional: false, specific: false, slot: "" });
    renderGear(); markDirty();
  }));
}

async function saveGear() {
  // Validate ids unique + non-empty.
  const ids = gearRows.map(r => r.id.trim());
  if (ids.some(x => !x)) { setMsg("Every row needs an id.", "err"); return; }
  if (new Set(ids).size !== ids.length) { setMsg("Duplicate ids. Ids must be unique.", "err"); return; }
  setMsg("Saving…");
  // Delete removed rows first.
  for (const id of removedIds) {
    const { error } = await sb.from("gear").delete().eq("id", id);
    if (error) { setMsg("Delete failed: " + error.message, "err"); return; }
  }
  const payload = gearRows.map((r, i) => ({
    id: r.id.trim(), category: r.category, name: r.name, note: r.note || null,
    price_usd: Number(r.price_usd) || 0, url: r.url || null, search: r.search || null,
    optional: !!r.optional, specific: !!r.specific, slot: r.slot || null, sort_order: i,
  }));
  const { error } = await sb.from("gear").upsert(payload);
  if (error) { setMsg("Save failed: " + error.message, "err"); return; }
  setMsg("Saved " + payload.length + " gear rows. Live on phones now.", "ok");
  await loadGear();
}

// ---------------- BIKE UPGRADES ----------------
async function loadUpgrades() {
  setMsg("");
  const bikeId = upgradeScope === "universal" ? null : upgradeScope;
  let q = sb.from("bike_upgrades").select("*").order("sort_order", { ascending: true });
  q = bikeId === null ? q.is("bike_id", null) : q.eq("bike_id", bikeId);
  const { data, error } = await q;
  if (error) { setStatus("read error", "err"); setMsg(error.message, "err"); return; }
  upgradeRows = (data || []).map(r => ({
    id: r.id, item: r.item || "", why: r.why || "",
    price_usd: r.price_usd == null ? "" : Number(r.price_usd),
    tier: r.tier || "", url: r.url || "", search: r.search || "",
    image_url: r.image_url || "", category: r.category || "",
  }));
  loadedIds = new Set(upgradeRows.map(r => r.id));
  removedIds = new Set();
  setStatus("connected · " + upgradeRows.length + " rows", "ok");
  renderUpgrades();
}

function renderScopebar() {
  scopebarEl.style.display = "flex";
  scopebarEl.innerHTML = BIKES.map(b =>
    `<button class="chip ${b.id === upgradeScope ? "on" : ""}" data-scope="${b.id}">${esc(b.name)}</button>`
  ).join("");
  scopebarEl.querySelectorAll("[data-scope]").forEach(c => c.addEventListener("click", async () => {
    if (isDirty && !confirm("Discard unsaved changes and switch bike?")) return;
    upgradeScope = c.dataset.scope; isDirty = false;
    await loadUpgrades();
  }));
}

// Tier is a fixed vocabulary the app understands: "rec" and "nice" are their own
// sections, anything else is "must". Render it as a dropdown so no typos slip in.
// Any legacy/nonstandard value is preserved as a selectable option until changed.
const TIER_OPTIONS = ["must", "rec", "nice"];
const TIER_LABELS = { must: "Must have", rec: "Highly recommended", nice: "Nice to have" };
// The app files a part into the Tools section by its category, not its tier. So
// "Tool" is a fourth choice in this dropdown: picking it stamps the row with the
// Tools category the app looks for; picking any real tier clears that category.
const TOOLS_CATEGORY = "Tools & recovery";
function tierCell(r, i) {
  const isTool = String(r.category || "").trim() === TOOLS_CATEGORY;
  const cur = (r.tier == null ? "" : String(r.tier)).trim();
  const known = TIER_OPTIONS.includes(cur);
  let html = `<select class="tiersel" data-i="${i}" data-f="section">`;
  if (!isTool && !known) html += `<option value="${esc(cur)}" selected>${cur ? esc(cur) : "— none —"}</option>`;
  TIER_OPTIONS.forEach(o => {
    html += `<option value="${o}" ${!isTool && known && cur === o ? "selected" : ""}>${TIER_LABELS[o]}</option>`;
  });
  html += `<option value="tool" ${isTool ? "selected" : ""}>Tool</option>`;
  html += `</select>`;
  return html;
}

// The four buckets the app renders a bike's parts into, in display order. A row's
// bucket is derived from its category (Tools) or tier (everything else), so the
// admin groups exactly the way the app does.
const UPGRADE_SECTIONS = [
  { key: "must", label: "Must have" },
  { key: "rec",  label: "Highly recommended" },
  { key: "nice", label: "Nice to have" },
  { key: "tool", label: "Tools" },
];
function sectionOf(r) {
  if (String(r.category || "").trim() === TOOLS_CATEGORY) return "tool";
  const t = String(r.tier || "").trim();
  if (t === "rec") return "rec";
  if (t === "nice") return "nice";
  return "must";
}
// Which section blocks are collapsed. Persists across re-renders within a session.
let upgradeCollapsed = new Set();
