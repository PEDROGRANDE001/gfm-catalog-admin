      <td class="colsearch"><input value="${esc(r.search)}" data-i="${i}" data-f="search"></td>
      <td class="act colact">
        <button class="btn move" data-up="${i}" title="Move up"${si === 0 ? " disabled" : ""}>▲</button>
        <button class="btn move" data-down="${i}" title="Move down"${si === slen - 1 ? " disabled" : ""}>▼</button>
        <button class="btn danger" data-del="${i}">✕</button>
      </td>
    </tr>`;
  };
  let html = `<div class="catblock"><h2>${esc(name)} (${upgradeRows.length})</h2></div>`;
  UPGRADE_SECTIONS.forEach(sec => {
    const rows = upgradeRows.filter(r => sectionOf(r) === sec.key);
    const collapsed = upgradeCollapsed.has(sec.key);
    html += `<div class="catblock">
      <h2 class="grouphdr collapser" data-collapse="${sec.key}"><span class="caret">${collapsed ? "▸" : "▾"}</span> ${sec.label} <span style="color:var(--muted);font-weight:700;font-size:12px">(${rows.length})</span></h2>
      ${collapsed ? "" : `<table>${thead}<tbody>${rows.map((r, si) => rowHtml(r, si, rows.length)).join("")}</tbody></table>
      <button class="btn add" data-addup="${sec.key}">+ Add ${sec.label} item</button>`}
    </div>`;
  });
  contentEl.innerHTML = html;
  wireUpgradeInputs();
}

function wireUpgradeInputs() {
  contentEl.querySelectorAll("input,textarea").forEach(el => {
    el.addEventListener("input", () => {
      const i = +el.dataset.i, f = el.dataset.f;
      if (i == null || !f) return;
      if (f === "price_usd") upgradeRows[i][f] = el.value === "" ? "" : (Number(el.value) || 0);
      else upgradeRows[i][f] = el.value;
      markDirty();
    });
  });
  contentEl.querySelectorAll("select[data-f]").forEach(el => {
    el.addEventListener("change", () => {
      const i = +el.dataset.i, f = el.dataset.f;
      if (i == null || !f) return;
      if (f === "section") {
        if (el.value === "tool") {
          upgradeRows[i].category = TOOLS_CATEGORY;   // moves it to the Tools section
        } else {
          upgradeRows[i].tier = el.value;
          upgradeRows[i].category = "";               // back to a normal tiered part
        }
      } else {
        upgradeRows[i][f] = el.value;
      }
      renderUpgrades();   // re-render so a normalized tier drops any legacy option
      markDirty();
    });
  });
  contentEl.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.del, row = upgradeRows[i];
    if (!confirm("Delete upgrade \"" + (row.item || row.id) + "\"?")) return;
    if (loadedIds.has(row.id)) removedIds.add(row.id);
    upgradeRows.splice(i, 1);
    renderUpgrades(); markDirty();
  }));
  contentEl.querySelectorAll("[data-addup]").forEach(b => b.addEventListener("click", () => {
    const p = upgradeScope === "universal" ? "u" : upgradeScope;
    const sec = b.dataset.addup;
    const row = { id: uid(p), item: "", why: "", price_usd: "", tier: "rec", url: "", image_url: "", search: "", category: "" };
    if (sec === "tool") row.category = TOOLS_CATEGORY;
    else if (sec === "must") row.tier = "must";
    else if (sec === "nice") row.tier = "nice";
    else row.tier = "rec";
    upgradeRows.push(row);
    upgradeCollapsed.delete(sec);   // make sure the section they're adding to is open
    renderUpgrades(); markDirty();
  }));
  contentEl.querySelectorAll("[data-collapse]").forEach(h => h.addEventListener("click", () => {
    const key = h.dataset.collapse;
    if (upgradeCollapsed.has(key)) upgradeCollapsed.delete(key); else upgradeCollapsed.add(key);
    renderUpgrades();
  }));
  contentEl.querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => moveUpgrade(+b.dataset.up, -1)));
  contentEl.querySelectorAll("[data-down]").forEach(b => b.addEventListener("click", () => moveUpgrade(+b.dataset.down, 1)));
}

// Swap a row with its nearest neighbour in the SAME section, so reordering stays
// inside a bucket instead of jumping a part into a different tier. The row order
// shown here is what saves into sort_order, so this sets the app display order.
function moveUpgrade(i, dir) {
  const sec = sectionOf(upgradeRows[i]);
  let j = i + dir;
  while (j >= 0 && j < upgradeRows.length && sectionOf(upgradeRows[j]) !== sec) j += dir;
  if (j < 0 || j >= upgradeRows.length) return;
  const t = upgradeRows[i]; upgradeRows[i] = upgradeRows[j]; upgradeRows[j] = t;
  renderUpgrades(); markDirty();
}

// Sort the current bike's upgrade rows by the tier column. Click toggles
// ascending -> descending. Empty tiers always sink to the bottom. Numeric tiers
// sort numerically; text tiers fall back to alphabetical. Saving persists the
// new order (rows save top-to-bottom), so this doubles as a reorder tool.
function sortUpgradesByTier() {
  tierSortDir = tierSortDir === 1 ? -1 : 1;
  const rank = (t) => {
    const s = String(t == null ? "" : t).trim();
    if (!s) return { empty: true, n: null, s: "" };
    const n = parseFloat(s);
    return { empty: false, n: isNaN(n) ? null : n, s: s.toLowerCase() };
  };
  upgradeRows.sort((a, b) => {
    const ra = rank(a.tier), rb = rank(b.tier);
    if (ra.empty && rb.empty) return 0;
    if (ra.empty) return 1;   // empties always last
    if (rb.empty) return -1;
    let cmp;
    if (ra.n != null && rb.n != null) cmp = ra.n - rb.n;
    else cmp = ra.s.localeCompare(rb.s);
    return cmp * tierSortDir;
  });
  renderUpgrades();
  markDirty();
}

async function saveUpgrades() {
  const ids = upgradeRows.map(r => r.id.trim());
  if (ids.some(x => !x)) { setMsg("Every row needs an id.", "err"); return; }
  if (new Set(ids).size !== ids.length) { setMsg("Duplicate ids. Ids must be unique.", "err"); return; }
  setMsg("Saving…");
  for (const id of removedIds) {
    const { error } = await sb.from("bike_upgrades").delete().eq("id", id);
    if (error) { setMsg("Delete failed: " + error.message, "err"); return; }
  }
  const bikeId = upgradeScope === "universal" ? null : upgradeScope;
  // We split the save into UPDATEs (existing rows) and INSERTs (new rows).
  // Why not a single upsert: an upsert always builds an INSERT tuple first, and
  // if item/why are omitted that tuple is NULL, which trips the NOT NULL columns
  // BEFORE the on-conflict update can run. So one blank existing row would kill
  // the whole batch. UPDATEs have no insert phase, so we can safely OMIT blank
  // item / why / image / price on existing rows (never clobbering a name, photo
  // or price that Franka's sweep filled in after this page loaded). New rows are
  // INSERTed with empty strings so they satisfy the NOT NULL columns while still
  // reading as "blank" for the sweep to backfill later.
  const inserts = [];
  for (let i = 0; i < upgradeRows.length; i++) {
    const r = upgradeRows[i];
    const id = r.id.trim();
    const existing = loadedIds.has(id);
    const item = String(r.item || "").trim();
    const why = String(r.why || "").trim();
    const img = String(r.image_url || "").trim();
    const hasPrice = r.price_usd !== "" && r.price_usd != null;
    const base = {
      id, bike_id: bikeId,
      tier: r.tier || null, url: r.url || null, search: r.search || null, sort_order: i,
      category: String(r.category || "").trim() || null,
    };
    if (existing) {
      const upd = { ...base };
      if (item) upd.item = item;         // omit blanks so we never wipe a filled value
      if (why) upd.why = why;
      if (img) upd.image_url = img;
      if (hasPrice) upd.price_usd = Number(r.price_usd) || 0;
      const { error } = await sb.from("bike_upgrades").update(upd).eq("id", id);
      if (error) { setMsg("Save failed: " + error.message, "err"); return; }
    } else {
      inserts.push({
        ...base,
        item, why,                        // always "" at worst, never null
        image_url: img || null,
        price_usd: hasPrice ? Number(r.price_usd) || 0 : null,
      });
    }
  }
  if (inserts.length) {
    const { error } = await sb.from("bike_upgrades").insert(inserts);
    if (error) { setMsg("Save failed: " + error.message, "err"); return; }
  }
  const missing = upgradeRows.filter(r => !String(r.item||"").trim() || !String(r.why||"").trim() || !String(r.image_url||"").trim()).length;
  const tail = missing ? ` ${missing} still need a name, description or photo — hit "Ask Franka to fill blanks" and she'll complete them on her next sweep (usually under 30 min).` : "";
  setMsg("Saved " + upgradeRows.length + " upgrades. Live on phones now." + tail, "ok");
  await loadUpgrades();
}

// ---------------- TASKS ----------------
async function loadTasks() {
  setMsg("");
  scopebarEl.style.display = "none";
  const { data, error } = await sb.from("tasks").select("*").order("sort_order", { ascending: true });
  if (error) { setStatus("read error", "err"); setMsg(error.message, "err"); return; }
  tasksRows = (data || []).map(r => ({
    id: r.id, title: r.title || "", notes: r.notes || "", category: r.category || "",
    status: TASK_STATUS.includes(r.status) ? r.status : "none", owner: r.owner || "",
    priority: r.priority || "med", due_date: r.due_date || "",
    attachments: Array.isArray(r.attachments) ? r.attachments : [],
    memo: r.memo || "", archived: !!r.archived,
  }));
  loadedIds = new Set(tasksRows.map(r => r.id));
  removedIds = new Set();
  const open = tasksRows.filter(r => r.status !== "done").length;
  setStatus("connected · " + open + " open / " + tasksRows.length + " total", "ok");
  renderTasks();
}

// Distinct categories in first-seen order (blank grouped as Uncategorized).
function taskCategories() {
  const seen = [];
  tasksRows.forEach(r => { const c = (r.category || "").trim(); if (!seen.includes(c)) seen.push(c); });
  if (seen.length === 0) seen.push("");
  return seen;
}
// Siblings that share a category and archive-state (the reorder scope).
function taskSiblings(r) {
  if (r.archived) return tasksRows.filter(x => x.archived);
  const cat = (r.category || "").trim();
  return tasksRows.filter(x => !x.archived && (x.category || "").trim() === cat);
}

function renderTasks() {
  scopebarEl.style.display = "none";
  hintEl.textContent = "";
  const cats = taskCategories();
  const byDue = (a, b) => {                       // blank due dates sink to the bottom
    const da = a.due_date || "", db = b.due_date || "";
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da < db ? -1 : da > db ? 1 : 0;
  };
  const byOwner = (a, b) => {                      // blank owners sink to the bottom
    const oa = (a.owner || "").trim(), ob = (b.owner || "").trim();
    if (!oa && !ob) return 0;
    if (!oa) return 1;
    if (!ob) return -1;
    return oa.localeCompare(ob);
  };
  const applySort = (list) =>
    taskSortByOwner ? list.slice().sort(byOwner)
    : taskSortByDue ? list.slice().sort(byDue)
    : list;
  const sortActive = taskSortByDue || taskSortByOwner;
  const ownerArrow = taskSortByOwner ? "▲" : "⇅";
  const dueArrow = taskSortByDue ? "▲" : "⇅";
  let html = "";
  const thead = `<thead><tr>
        <th class="colnotes">detail</th>
        <th class="colowner sortable" data-sortown="1">assigned to <span class="arrow">${ownerArrow}</span></th>
        <th class="coldue sortable" data-sortdue="1">due <span class="arrow">${dueArrow}</span></th>
        <th class="colnote">note</th>
        <th class="colstatus">status</th><th class="colact"></th>
      </tr></thead>`;
  const rowHtml = (r) => {
    const i = tasksRows.indexOf(r);
    const isDone = r.status === "done";
    const sibs = taskSiblings(r);
    const si = sibs.indexOf(r);
    const ownerOpts = TASK_OWNERS.map(o =>
      `<option value="${esc(o)}" ${o === r.owner ? "selected" : ""}>${o ? esc(o) : "—"}</option>`).join("");
    const st = TASK_STATUS.includes(r.status) ? r.status : "none";
    const statusOpts = TASK_STATUS.map(s =>
      `<option value="${s}" ${s === st ? "selected" : ""}>${TASK_STATUS_LABEL[s]}</option>`).join("");
    return `<tr class="${isDone ? "taskdone" : ""}">
        <td class="colnotes"><textarea rows="2" data-i="${i}" data-f="notes" placeholder="What needs doing">${esc(r.notes)}</textarea></td>
        <td class="colowner"><select data-i="${i}" data-f="owner">${ownerOpts}</select></td>
        <td class="coldue"><input type="date" value="${esc(r.due_date)}" data-i="${i}" data-f="due_date" onclick="try{this.showPicker()}catch(e){}"></td>
        <td class="colnote">${renderNoteCell(r, i)}</td>
        <td class="colstatus"><select class="statussel status-${st}" data-i="${i}" data-f="status">${statusOpts}</select></td>
        <td class="act colact">
          <button class="btn move" data-up="${i}" title="Move up"${sortActive || si === 0 ? " disabled" : ""}>▲</button>
          <button class="btn move" data-down="${i}" title="Move down"${sortActive || si === sibs.length - 1 ? " disabled" : ""}>▼</button>
          ${r.archived
            ? `<button class="btn" data-unarch="${i}" title="Restore to board">↩</button>`
            : `<button class="btn arch" data-arch="${i}" title="Archive to bottom">Archive</button>`}
          <button class="btn danger" data-del="${i}">✕</button>
        </td>
      </tr>`;
  };
  // "My Tasks only" filter bar, pinned above the first category.
  const filterOn = taskMineOnly && !!taskOwnerFilter;
  const mineOpts = TASK_OWNERS.filter(o => o).map(o =>
    `<option value="${esc(o)}" ${o === taskOwnerFilter ? "selected" : ""}>${esc(o)}</option>`).join("");
  html += `<div class="taskfilter">
      <button class="btn mineonly${taskMineOnly ? " on" : ""}" data-mineonly="1">My Tasks only</button>
      <select class="minesel" data-minesel="1"><option value="">Select name…</option>${mineOpts}</select>
    </div>`;
  const mineMatch = (r) => !filterOn || (r.owner || "").trim() === taskOwnerFilter;
  // Category blocks show LIVE (non-archived) tasks, done ones included so they
  // stay visible for review until archived. Archived tasks collect below.
  cats.forEach((cat, ci) => {
    let live = tasksRows.filter(r => (r.category || "").trim() === cat && !r.archived && mineMatch(r));
    if (filterOn && live.length === 0) return;   // hide categories with none of my tasks
    live = applySort(live);
    const doneCount = live.filter(r => r.status === "done").length;
    const label = cat || "Uncategorized";
    const countTxt = doneCount ? `${live.length} live · ${doneCount} done` : `${live.length} live`;
    const collapsed = taskCollapsed.has(cat);
    html += `<div class="catblock">
      <h2 class="grouphdr collapser" data-collapse="${esc(cat)}"><span class="caret">${collapsed ? "▸" : "▾"}</span> ${esc(label)} <span style="color:var(--muted);font-weight:700;font-size:12px">(${countTxt})</span>
        <span class="catmove">
          <button class="btn move" data-catup="${esc(cat)}" title="Move category up"${ci === 0 ? " disabled" : ""}>▲</button>
          <button class="btn move" data-catdown="${esc(cat)}" title="Move category down"${ci === cats.length - 1 ? " disabled" : ""}>▼</button>
          <button class="btn" data-catedit="${esc(cat)}" title="Rename category">✎</button>
          <button class="btn danger" data-catdel="${esc(cat)}" title="Delete category">🗑</button>
        </span>
      </h2>
      ${collapsed ? "" : `<table>${thead}<tbody>${live.map(rowHtml).join("")}</tbody></table>
      <button class="btn add" data-addtask="${esc(cat)}">+ Add task</button>`}</div>`;
  });
  html += `<button class="btn add" data-addcat="1" style="margin-top:4px">+ Add category</button>`;
  // Single "Archived" section at the very bottom of the whole board.
  let archRows = tasksRows.filter(r => r.archived && mineMatch(r));
  if (archRows.length) {
    archRows = applySort(archRows);
    const aCollapsed = taskCollapsed.has("__archived__");
    html += `<div class="catblock donesection">
      <h2 class="grouphdr collapser" data-collapse="__archived__"><span class="caret">${aCollapsed ? "▸" : "▾"}</span> Archived <span style="color:var(--muted);font-weight:700;font-size:12px">(${archRows.length})</span></h2>
      ${aCollapsed ? "" : `<table>${thead}<tbody>${archRows.map(rowHtml).join("")}</tbody></table>`}</div>`;
  }
  contentEl.innerHTML = html;
  wireTaskInputs();
  if (pendingFocusId !== null) {
    const fi = tasksRows.findIndex(r => r.id === pendingFocusId);
    pendingFocusId = null;
    if (fi >= 0) {
      const ta = contentEl.querySelector(`textarea[data-f="notes"][data-i="${fi}"]`);
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }
  }
}

function wireTaskInputs() {
  contentEl.querySelectorAll("input,textarea,select").forEach(el => {
    const f = el.dataset.f;
    if (!f) return;
    if (f === "status") {
      el.addEventListener("change", () => {
        tasksRows[+el.dataset.i].status = el.value;
        renderTasks(); markDirty();          // done stays put; Archive is what drops it
      });
    } else if (f === "category") {
      el.addEventListener("input", () => { tasksRows[+el.dataset.i].category = el.value; markDirty(); });
      el.addEventListener("change", () => renderTasks());   // regroup on blur
    } else {
      const evt = el.tagName === "SELECT" ? "change" : "input";
      el.addEventListener(evt, () => { tasksRows[+el.dataset.i][f] = el.value; markDirty(); });
    }
  });
  contentEl.querySelectorAll('textarea[data-f="notes"]').forEach(t => t.addEventListener("keydown", async (e) => {
    if (e.key === "Enter" && !e.shiftKey) {   // Enter saves the row; Shift+Enter = newline
      e.preventDefault();
      const i = +t.dataset.i;
      const r = tasksRows[i];
      r.notes = t.value;
      if (!(r.notes || "").trim()) return;    // empty row: nothing to save, nothing to spawn
      await saveOneTask(i);
      // Monday-style: drop a fresh empty task in the same category and jump into it.
      if (!r.archived) {
        const fresh = { id: uid("task"), title: "", notes: "", category: r.category || "", status: "none", owner: "", priority: "med", due_date: "", attachments: [], memo: "", archived: false };
        tasksRows.splice(i + 1, 0, fresh);
        pendingFocusId = fresh.id;
        renderTasks(); markDirty();
      } else {
        t.blur();
      }
    }
  }));
  contentEl.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.del, row = tasksRows[i];
    if (!confirm("Delete task \"" + ((row.notes || "").trim() || row.id) + "\"?")) return;
    if (loadedIds.has(row.id)) removedIds.add(row.id);
    tasksRows.splice(i, 1);
    renderTasks(); markDirty();
  }));
  contentEl.querySelectorAll("[data-addtask]").forEach(b => b.addEventListener("click", () => {
    const fresh = { id: uid("task"), title: "", notes: "", category: b.dataset.addtask || "", status: "none", owner: "", priority: "med", due_date: "", attachments: [], memo: "", archived: false };
    tasksRows.push(fresh);
    pendingFocusId = fresh.id;
    renderTasks(); markDirty();
  }));
  const addCat = contentEl.querySelector("[data-addcat]");
  if (addCat) addCat.addEventListener("click", () => {
    const name = prompt("New category name:");
    if (name === null) return;
    const fresh = { id: uid("task"), title: "", notes: "", category: name.trim(), status: "none", owner: "", priority: "med", due_date: "", attachments: [], memo: "", archived: false };
    tasksRows.push(fresh);
    pendingFocusId = fresh.id;
    renderTasks(); markDirty();
  });
  contentEl.querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => moveTask(+b.dataset.up, -1)));
  contentEl.querySelectorAll("[data-down]").forEach(b => b.addEventListener("click", () => moveTask(+b.dataset.down, 1)));
  contentEl.querySelectorAll("[data-sortdue]").forEach(h => h.addEventListener("click", () => {
    taskSortByDue = !taskSortByDue; taskSortByOwner = false; renderTasks();
  }));
  contentEl.querySelectorAll("[data-sortown]").forEach(h => h.addEventListener("click", () => {
    taskSortByOwner = !taskSortByOwner; taskSortByDue = false; renderTasks();
  }));
  contentEl.querySelectorAll("[data-collapse]").forEach(h => h.addEventListener("click", () => {
    const key = h.dataset.collapse;
    if (taskCollapsed.has(key)) taskCollapsed.delete(key); else taskCollapsed.add(key);
    renderTasks();
  }));
  contentEl.querySelectorAll("[data-catup]").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation(); moveCategory(b.dataset.catup, -1);
  }));
  contentEl.querySelectorAll("[data-catdown]").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation(); moveCategory(b.dataset.catdown, 1);
  }));
  contentEl.querySelectorAll("[data-catedit]").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation(); renameCategory(b.dataset.catedit);
  }));
  contentEl.querySelectorAll("[data-catdel]").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation(); deleteCategory(b.dataset.catdel);
  }));
  contentEl.querySelectorAll("[data-arch]").forEach(b => b.addEventListener("click", () => {
    tasksRows[+b.dataset.arch].archived = true; renderTasks(); markDirty();
  }));
  contentEl.querySelectorAll("[data-unarch]").forEach(b => b.addEventListener("click", () => {
    tasksRows[+b.dataset.unarch].archived = false; renderTasks(); markDirty();
  }));
  contentEl.querySelectorAll("[data-note]").forEach(b =>
    b.addEventListener("click", () => openNoteModal(+b.dataset.note)));
  const mineBtn = contentEl.querySelector("[data-mineonly]");
  if (mineBtn) mineBtn.addEventListener("click", () => {
    taskMineOnly = !taskMineOnly; renderTasks();
  });
  const mineSel = contentEl.querySelector("[data-minesel]");
  if (mineSel) mineSel.addEventListener("change", () => {
    taskOwnerFilter = mineSel.value;
    if (taskOwnerFilter) taskMineOnly = true;   // picking a name turns the filter on
    renderTasks();
  });
}

// Swap a task with its nearest sibling (same category + archive-state). The global
// row order is what saves into sort_order, so this hand-arranges the board.
function moveTask(i, dir) {
  const r = tasksRows[i];
  const cat = (r.category || "").trim(), arch = !!r.archived;
  let j = i + dir;
  while (j >= 0 && j < tasksRows.length) {
    const x = tasksRows[j];
    const match = arch
      ? !!x.archived                                              // archived = one global group
      : (!x.archived && (x.category || "").trim() === cat);       // live = grouped by category
    if (match) break;
    j += dir;
  }
  if (j < 0 || j >= tasksRows.length) return;
  const t = tasksRows[i]; tasksRows[i] = tasksRows[j]; tasksRows[j] = t;
  renderTasks(); markDirty();
}

// Move a whole category block up or down. Category order is derived from the
// first-seen order of rows, so we regroup tasksRows by the swapped category order.
// Rows keep their in-category order; sort_order persists on Save.
function moveCategory(cat, dir) {
  cat = (cat || "").trim();
  const cats = taskCategories();
  const idx = cats.indexOf(cat);
  const tgt = idx + dir;
  if (idx < 0 || tgt < 0 || tgt >= cats.length) return;
  const t = cats[idx]; cats[idx] = cats[tgt]; cats[tgt] = t;
  const byCat = {};
  cats.forEach(c => byCat[c] = []);
  tasksRows.forEach(r => { const c = (r.category || "").trim(); (byCat[c] ||= []).push(r); });
  tasksRows = cats.flatMap(c => byCat[c]);
  renderTasks(); markDirty();
}

// Rename a category: retitle every row (live and archived) that carries it.
function renameCategory(cat) {
  cat = (cat || "").trim();
  const label = cat || "Uncategorized";
  const next = prompt("Rename category:", cat);
  if (next === null) return;
  const trimmed = next.trim();
  if (trimmed === cat) return;
  tasksRows.forEach(r => { if ((r.category || "").trim() === cat) r.category = trimmed; });
  // Carry any collapsed state over to the new key.
  if (taskCollapsed.has(cat)) { taskCollapsed.delete(cat); taskCollapsed.add(trimmed); }
  renderTasks(); markDirty();
}

// Delete a whole category and every task in it, after confirming.
function deleteCategory(cat) {
  cat = (cat || "").trim();
  const label = cat || "Uncategorized";
  const doomed = tasksRows.filter(r => (r.category || "").trim() === cat);
  if (!confirm(`Delete category "${label}" and its ${doomed.length} task${doomed.length === 1 ? "" : "s"}? This cannot be undone.`)) return;
  doomed.forEach(r => { if (loadedIds.has(r.id)) removedIds.add(r.id); });
  tasksRows = tasksRows.filter(r => (r.category || "").trim() !== cat);
  taskCollapsed.delete(cat);
  renderTasks(); markDirty();
}

// Row cell: a single icon that opens the note modal. Fills in when the task
// carries a note and/or attachments so it stays visible on the board.
function renderNoteCell(r, i) {
  const nFiles = Array.isArray(r.attachments) ? r.attachments.length : 0;
  const has = !!(r.memo || "").trim() || nFiles > 0;
  const badge = nFiles ? `<span class="badge">${nFiles}</span>` : "";
  const glyph = has ? "🗒" : "＋";
  const title = has ? "View / edit note" : "Add a note";
  return `<button class="notebtn ${has ? "has" : ""}" data-note="${i}" title="${title}">${glyph}${badge}</button>`;
}

// Attachment chips + add button, rendered inside the note modal.
function renderModalAttachments(r, i) {
  const files = Array.isArray(r.attachments) ? r.attachments : [];
  const chips = files.map((f, k) =>
    `<span class="filechip"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>` +
    `<button class="filex" data-fi="${i}" data-fk="${k}" title="Remove">✕</button></span>`).join("");
  return `<div class="files">${chips}` +
    `<label class="btn attach" title="Attach files">＋<input type="file" data-fileup="${i}" hidden multiple></label></div>`;
}

let noteIdx = -1;
function openNoteModal(i) {
  noteIdx = i;
  const r = tasksRows[i];
  const label = (r.notes || "").trim();
  document.getElementById("note-title").textContent = label ? ("Note · " + label.slice(0, 60)) : "Note";
  document.getElementById("note-text").value = r.memo || "";
  document.getElementById("note-msg").textContent = "";
  renderModalFiles();
  document.getElementById("notemodal").style.display = "flex";
  document.getElementById("note-text").focus();
}
function closeNoteModal() {
  document.getElementById("notemodal").style.display = "none";
  noteIdx = -1;
}
function renderModalFiles() {
  if (noteIdx < 0) return;
  const box = document.getElementById("note-files");
  box.innerHTML = renderModalAttachments(tasksRows[noteIdx], noteIdx);
  box.querySelectorAll("[data-fileup]").forEach(inp => inp.addEventListener("change", () => {
    if (inp.files && inp.files.length) uploadTaskFiles(+inp.dataset.fileup, Array.from(inp.files));
  }));
  box.querySelectorAll(".filex").forEach(b =>
    b.addEventListener("click", () => removeAttachment(+b.dataset.fi, +b.dataset.fk)));
}

async function uploadTaskFiles(i, fileList) {
  const row = tasksRows[i];
  if (!Array.isArray(row.attachments)) row.attachments = [];
  const MAX = 10 * 1024 * 1024;
  const toobig = fileList.find(f => f.size > MAX);
  if (toobig) { setMsg(`"${toobig.name}" is over the 10 MB limit.`, "err"); return; }
  setMsg("Uploading…");
  for (const file of fileList) {
    const clean = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = row.id + "/" + Date.now() + "-" + clean;
    const { error } = await sb.storage.from("task-files").upload(path, file, { upsert: true });
    if (error) { setMsg("Upload failed: " + error.message, "err"); return; }
    const { data } = sb.storage.from("task-files").getPublicUrl(path);
    row.attachments.push({ name: file.name, url: data.publicUrl, path });
  }
  renderTasks(); renderModalFiles(); markDirty();
  const nm = document.getElementById("note-msg");
  if (nm) nm.textContent = "File attached. Hit Save note to keep it.";
  setMsg("File attached. Click Save to keep it on the task.", "");
}

async function removeAttachment(i, k) {
  const row = tasksRows[i];
  const f = (row.attachments || [])[k];
  if (!f) return;
  if (!confirm("Remove \"" + (f.name || "file") + "\"?")) return;
  if (f.path) { try { await sb.storage.from("task-files").remove([f.path]); } catch (e) {} }
  row.attachments.splice(k, 1);
  renderTasks(); renderModalFiles(); markDirty();
}

// Single row -> DB row. Shared by full save, note save, and Enter-to-save.
function taskPayload(r, i) {
  return {
    id: r.id.trim(), title: (r.notes || "").trim(), notes: r.notes || null,
    category: (r.category || "").trim() || null,
    status: TASK_STATUS.includes(r.status) ? r.status : "none", owner: r.owner || null,
    priority: r.priority || "med", due_date: r.due_date || null, sort_order: i,
    attachments: Array.isArray(r.attachments) ? r.attachments : [],
    memo: (r.memo || "").trim() || null, archived: !!r.archived,
  };
}

// Monday-style: hit Enter in a task's detail and just that row saves to the cloud.
async function saveOneTask(i) {
  const r = tasksRows[i];
  if (!(r.notes || "").trim()) return;   // nothing to commit yet
  setMsg("Saving…");
  const { error } = await sb.from("tasks").upsert(taskPayload(r, i));
  if (error) { setMsg("Save failed: " + error.message, "err"); return; }
  loadedIds.add(r.id.trim());
  setMsg("Saved.", "ok");
}

async function saveTasks() {
  const ids = tasksRows.map(r => r.id.trim());
  if (ids.some(x => !x)) { setMsg("Every task needs an id.", "err"); return; }
  if (new Set(ids).size !== ids.length) { setMsg("Duplicate ids. Ids must be unique.", "err"); return; }
  if (tasksRows.some(r => !(r.notes || "").trim())) { setMsg("Every task needs a detail.", "err"); return; }
  setMsg("Saving…");
  for (const id of removedIds) {
    const { error } = await sb.from("tasks").delete().eq("id", id);
    if (error) { setMsg("Delete failed: " + error.message, "err"); return; }
  }
  const payload = tasksRows.map((r, i) => taskPayload(r, i));
  const { error } = await sb.from("tasks").upsert(payload);
  if (error) { setMsg("Save failed: " + error.message, "err"); return; }
  setMsg("Saved " + payload.length + " tasks.", "ok");
  await loadTasks();
}

// ---------------- RECOMMENDATIONS (read-only archive) ----------------
// A frozen snapshot of every bike recommendation ever made, including the
// original v1 picks that had no image and were removed from the live app.
// Reference only, so nothing here writes back to Supabase. Kept so a good
// recommendation is never lost even after it is scrubbed from the phone app.
let archiveFilter = "";
async function loadArchive() {
  setMsg("");
  scopebarEl.style.display = "none";
  const recs = (typeof ARCHIVE_RECS !== "undefined") ? ARCHIVE_RECS : [];
  const inApp = recs.filter(r => r.img).length;
  setStatus("archive · " + recs.length + " recs (" + inApp + " with image / " + (recs.length - inApp) + " removed)", "ok");
  renderArchive();
}
function bikeName(id) {
  const b = BIKES.find(x => x.id === id);
  return b ? b.name : (id || "Universal");
}
function renderArchive() {
  scopebarEl.style.display = "none";
  hintEl.textContent = "Read-only master list of every bike recommendation, including original picks removed from the app for having no image. Reference only. To re-add one, copy it into the Bike Upgrades tab and give it a real image link.";
  const recs = (typeof ARCHIVE_RECS !== "undefined") ? ARCHIVE_RECS.slice() : [];
  const q = archiveFilter.trim().toLowerCase();
  const match = (r) => !q || (r.i && r.i.toLowerCase().includes(q)) || (r.w && r.w.toLowerCase().includes(q)) || bikeName(r.b).toLowerCase().includes(q) || (r.t && r.t.toLowerCase().includes(q));
  const filtered = recs.filter(match);
  // Group by bike, in the BIKES display order, unknown bikes last.
  const order = BIKES.map(b => b.id);
  const byBike = {};
  filtered.forEach(r => { (byBike[r.b] ||= []).push(r); });
  const bikeIds = Object.keys(byBike).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
  });
  let html = `<div style="margin-bottom:14px"><input id="archsearch" placeholder="Filter by bike, item, tier, or reason…" value="${esc(archiveFilter)}" style="width:100%;max-width:420px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 12px;font:inherit;font-size:14px"></div>`;
  if (!bikeIds.length) { html += `<p class="hint">No recommendations match "${esc(archiveFilter)}".</p>`; }
  bikeIds.forEach(bid => {
    const rows = byBike[bid];
    html += `<div class="catblock"><h2>${esc(bikeName(bid))} (${rows.length})</h2>
      <table><thead><tr>
        <th>item</th><th class="coltier">tier</th><th class="colnum">price $</th>
        <th class="colwhy">why</th><th>link</th><th style="width:120px">in app?</th>
      </tr></thead><tbody>`;
    rows.forEach(r => {
      const price = (r.p == null || r.p === "") ? "" : ("$" + r.p);
      const link = r.u ? `<a href="${esc(r.u)}" target="_blank" rel="noopener">open</a>` : "";
      const badge = r.img
        ? `<span style="color:var(--ok);font-weight:700">✓ live</span>`
        : `<span style="color:var(--danger);font-weight:700">removed (no image)</span>`;
      html += `<tr>
        <td>${esc(r.i)}</td>
        <td class="coltier">${esc(r.t)}</td>
        <td class="num colnum">${price}</td>
        <td class="colwhy">${esc(r.w)}</td>
        <td>${link}</td>
        <td>${badge}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });
  contentEl.innerHTML = html;
  const s = document.getElementById("archsearch");
  if (s) s.addEventListener("input", () => {
    archiveFilter = s.value;
    const pos = s.selectionStart;
    renderArchive();
    const s2 = document.getElementById("archsearch");
    if (s2) { s2.focus(); try { s2.setSelectionRange(pos, pos); } catch (e) {} }
  });
}

// ---------------- shared ----------------
let isDirty = false;
function markDirty() { isDirty = true; setMsg("Unsaved changes.", ""); msgEl.classList.add("dirty"); }
// A browser refresh/close bypasses the in-app confirms, so guard it too. This is
// what stops "I added tasks and they disappeared" when the page reloads unsaved.
window.addEventListener("beforeunload", (e) => {
  if (!isDirty) return;
  e.preventDefault(); e.returnValue = "";
});
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function selectTab(id) {
  ["tab-gear", "tab-upgrades", "tab-tasks", "tab-recs"].forEach(t =>
    document.getElementById(t).classList.toggle("on", t === id));
}
document.getElementById("tab-gear").addEventListener("click", async () => {
  if (isDirty && !confirm("Discard unsaved changes?")) return;
  mode = "gear"; isDirty = false; selectTab("tab-gear");
  await loadGear();
});
document.getElementById("tab-upgrades").addEventListener("click", async () => {
  if (isDirty && !confirm("Discard unsaved changes?")) return;
  mode = "upgrades"; isDirty = false; selectTab("tab-upgrades");
  await loadUpgrades();
});
document.getElementById("tab-tasks").addEventListener("click", async () => {
  if (isDirty && !confirm("Discard unsaved changes?")) return;
  mode = "tasks"; isDirty = false; selectTab("tab-tasks");
  await loadTasks();
});
document.getElementById("tab-recs").addEventListener("click", async () => {
  if (isDirty && !confirm("Discard unsaved changes?")) return;
  mode = "archive"; isDirty = false; selectTab("tab-recs");
  await loadArchive();
});
function loadCurrent() {
  return mode === "gear" ? loadGear() : mode === "upgrades" ? loadUpgrades() : mode === "archive" ? loadArchive() : loadTasks();
}
function saveCurrent() {
  if (mode === "archive") { setMsg("Recommendations is a read-only reference. Nothing to save.", ""); return; }
  return mode === "gear" ? saveGear() : mode === "upgrades" ? saveUpgrades() : saveTasks();
}
document.getElementById("save").addEventListener("click", async () => {
  document.getElementById("save").disabled = true;
  try { await saveCurrent(); isDirty = false; }
  finally { document.getElementById("save").disabled = false; }
});
document.getElementById("askfranka").addEventListener("click", async () => {
  const btn = document.getElementById("askfranka");
  btn.disabled = true;
  try {
    // Save first so the incomplete rows are in the database for Franka's sweep to find.
    await saveCurrent(); isDirty = false;
    if (mode !== "upgrades" && mode !== "gear") {
      setMsg("Nothing for Franka to fill in on this tab.", ""); return;
    }
    const rows = mode === "upgrades" ? upgradeRows : gearRows;
    const nameKey = mode === "upgrades" ? "item" : "name";
    const descKey = mode === "upgrades" ? "why" : "note";
    const blanks = rows.filter(r => r.url && (!String(r[nameKey]||"").trim() || !String(r[descKey]||"").trim() || !String(r.image_url||"").trim()));
    if (!blanks.length) { setMsg("Saved. Nothing blank — every part already has a name, description and photo. 👍", "ok"); return; }
    setMsg(`Saved. 🪄 Flagged ${blanks.length} part${blanks.length>1?"s":""} for Franka. She sweeps every 30 min, fills in names, descriptions and photos from the link, then texts Peter what got done. No need to do anything else.`, "ok");
  } finally { btn.disabled = false; }
});
document.getElementById("reload").addEventListener("click", async () => {
  if (isDirty && !confirm("Discard unsaved changes and reload?")) return;
  isDirty = false;
  await loadCurrent();
});

// ---------------- note modal ----------------
document.getElementById("note-text").addEventListener("input", (e) => {
  if (noteIdx < 0) return;
  tasksRows[noteIdx].memo = e.target.value;
});
document.getElementById("note-close").addEventListener("click", closeNoteModal);
document.getElementById("notemodal").addEventListener("click", (e) => {
  if (e.target.id === "notemodal") closeNoteModal();   // click backdrop to close
});
document.getElementById("note-save").addEventListener("click", async () => {
  if (noteIdx < 0) return;
  const r = tasksRows[noteIdx];
  r.memo = document.getElementById("note-text").value;
  const btn = document.getElementById("note-save");
  const nm = document.getElementById("note-msg");
  btn.disabled = true; nm.textContent = "Saving…";
  // Persist just this row so the note + files stay constant without a full board save.
  const { error } = await sb.from("tasks").upsert({
    id: r.id.trim(), title: (r.notes || "").trim(), notes: r.notes || null,
    category: (r.category || "").trim() || null,
    status: TASK_STATUS.includes(r.status) ? r.status : "none", owner: r.owner || null,
    priority: r.priority || "med", due_date: r.due_date || null,
    attachments: Array.isArray(r.attachments) ? r.attachments : [],
    memo: (r.memo || "").trim() || null, archived: !!r.archived,
  });
  btn.disabled = false;
  if (error) { nm.textContent = "Save failed: " + error.message; return; }
  loadedIds.add(r.id.trim());
  renderTasks();
  closeNoteModal();
  setMsg("Note saved.", "ok");
});

// ---------------- passcode gate ----------------
// Simple shared-passcode gate. This keeps casual visitors out of the editor.
// It is NOT hard security: the page talks to Supabase with the public anon key,
// so real lockdown would need Supabase Auth + tighter RLS. Change PASSCODE below
// (and re-deploy) any time.
const PASSCODE = "1962";
const GATE_KEY = "gfm.admin.unlocked.v1";

function boot() {
  if (!SUPABASE_URL || SUPABASE_URL.indexOf("__") === 0) {
    setStatus("not configured", "err");
    contentEl.innerHTML = "<p style='color:#ff5a5a'>Supabase keys were not injected. Regenerate this page.</p>";
    return;
  }
  loadTasks();
}

function unlock() {
  document.getElementById("gate").style.display = "none";
  document.body.classList.remove("locked");
  boot();
}

(function initGate() {
  const gate = document.getElementById("gate");
  const input = document.getElementById("gate-input");
  const err = document.getElementById("gate-err");
  const go = document.getElementById("gate-go");
  if (localStorage.getItem(GATE_KEY) === PASSCODE) { unlock(); return; }
  function attempt() {
    if (input.value === PASSCODE) {
      try { localStorage.setItem(GATE_KEY, PASSCODE); } catch (e) {}
      unlock();
    } else {
      err.textContent = "Wrong passcode.";
      input.value = ""; input.focus();
    }
  }
  go.addEventListener("click", attempt);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") attempt(); });
  input.focus();
})();
</script>
