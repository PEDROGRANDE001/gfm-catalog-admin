<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trans American Trail - Admin</title>
<style>
  :root {
    --bg: #0f141b; --panel: #161d27; --panel2: #1c2430; --line: #232a35;
    --txt: #e7ecf3; --muted: #8a97a8; --accent: #f5a623; --accent2: #3aa0ff;
    --danger: #ff5a5a; --ok: #37c871;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 800; }
  header .logo { width: 26px; height: 26px; border-radius: 6px; flex: none; }
  header .status { font-size: 13px; color: var(--muted); margin-left: auto; }
  header .status.ok { color: var(--ok); }
  header .status.err { color: var(--danger); }
  .tabs { display: flex; gap: 8px; }
  .tab {
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px;
  }
  .tab.on { background: var(--accent); color: #1a1205; border-color: var(--accent); }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .scopebar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 700;
  }
  .chip.on { background: var(--accent2); color: #04121f; border-color: var(--accent2); }
  .tasktools { display: flex; gap: 8px; margin-bottom: 16px; }
  .tasktools .btn.on { background: var(--accent, #2f7dff); color: #fff; border-color: var(--accent, #2f7dff); }
  .catblock { margin-bottom: 30px; }
  #content { padding-bottom: 32px; }
  .donesection { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 20px; }
  .catblock h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--txt); font-weight: 800; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
  td input, td textarea, td select {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 13px; resize: vertical;
  }
  td.num input { text-align: right; }
  td.chk { text-align: center; }
  td.act { white-space: nowrap; }
  .btn {
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); }
  .btn.danger { background: transparent; color: var(--danger); border-color: transparent; padding: 6px 8px; }
  .btn.add { color: var(--accent2); border-color: var(--accent2); background: transparent; margin-top: 8px; }
  .rowactions { display: flex; gap: 10px; align-items: center; margin: 18px 0 6px; }
  .rowactions .spacer { flex: 1; }
  .savebar {
    position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px 20px; display: flex; gap: 12px; align-items: center; margin: 0 -20px -20px;
  }
  .savebar .msg { font-size: 13px; color: var(--muted); }
  .savebar .msg.ok { color: var(--ok); }
  .savebar .msg.err { color: var(--danger); }
  .dirty { color: var(--accent); font-weight: 700; }
  .colid { width: 90px; }
  .colsearch { display: none; }
  .colnum { width: 90px; }
  .colcat { width: 130px; }
  .coltier { width: 110px; }
  .colchk { width: 60px; }
  .colact { width: 190px; white-space: nowrap; }
  .btn.move { padding: 5px 7px; color: var(--muted); background: transparent; border-color: transparent; }
  .btn.move:hover:not([disabled]) { color: var(--accent2); border-color: var(--accent2); }
  .btn.move[disabled] { opacity: .25; cursor: default; }
  .btn.arch { padding: 4px 9px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .btn.arch:hover { color: var(--txt); border-color: var(--accent); }
  .colwhy { width: 280px; }
  .colwhy textarea { min-height: 72px; line-height: 1.4; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--txt); }
  th.sortable .arrow { color: var(--accent); font-weight: 700; }
  a { color: var(--accent2); }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  /* Tasks board */
  .grouphdr { display: flex; align-items: center; gap: 9px; }
  .grouphdr.collapser { cursor: pointer; user-select: none; }
  .grouphdr.collapser:hover { color: var(--accent); }
  .grouphdr .caret { color: var(--muted); font-size: 20px; width: 22px; display: inline-block; }
  .catmove { display: inline-flex; gap: 4px; margin-left: 8px; }
  .catmove .btn.move { padding: 2px 7px; font-size: 12px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
  .colowner { width: 130px; }
  .colpri { width: 120px; }
  .coldue { width: 160px; }
  .colfiles { width: 180px; }
  .files { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .filechip { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.06);
    border: 1px solid var(--line, #333); border-radius: 6px; padding: 2px 6px; font-size: 12px; max-width: 160px; }
  .filechip a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
  .filechip .filex { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0; }
  .filechip .filex:hover { color: #ff5a5a; }
  .btn.attach { cursor: pointer; padding: 3px 9px; font-weight: 800; }
  .coldue input[type="date"] { cursor: pointer; }
  .coldue input[type="date"]::-webkit-calendar-picker-indicator {
    cursor: pointer; opacity: 1; font-size: 1.15em;
    filter: invert(48%) sepia(89%) saturate(2000%) hue-rotate(185deg);
  }
  .colstatus { width: 190px; }
  td select.statussel { font-weight: 800; }
  td select.statussel { -webkit-appearance: none; appearance: none; border-radius: 6px; text-align: center; }
  td select.status-none { color: #cfd4db; background: #3a3f47; border-color: #4a505a; }
  td select.status-not_started { color: #f3f4f6; background: #6b7280; border-color: #565d69; }
  td select.status-on_track { color: #eafff2; background: #2ecc71; border-color: #29b866; }
  td select.status-stuck { color: #fff0ef; background: #e74c3c; border-color: #d13b2c; }
  td select.status-ready { color: #2b1a00; background: #f5a623; border-color: #dc9313; }
  td select.status-done { color: #eaf4ff; background: #3b9dff; border-color: #2f88e6; }
  .colnotes { width: 640px; }
  .colnotes textarea { min-height: 46px; line-height: 1.4; }
  .colcat2 { width: 150px; }
  tr.taskdone td input, tr.taskdone td textarea, tr.taskdone td select { opacity: .5; }
  tr.taskdone td textarea[data-f="notes"] { text-decoration: line-through; }
  /* Note column + modal */
  .colnote { width: 74px; text-align: center; }
  .notebtn { cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 9px; font-size: 15px; color: var(--muted); position: relative; }
  .notebtn:hover { border-color: var(--accent); color: var(--txt); }
  .notebtn.has { color: var(--accent); border-color: var(--accent); background: rgba(245,166,35,.14); }
  .notebtn .badge { position: absolute; top: -6px; right: -6px; background: var(--accent); color: #1a1205;
    border-radius: 999px; min-width: 16px; height: 16px; padding: 0 3px; font-size: 10px; line-height: 16px; font-weight: 800; }
  #notemodal { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.62);
    display: flex; align-items: center; justify-content: center; padding: 20px; }
  #notemodal .nbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column; padding: 20px; }
  #notemodal .nhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #notemodal .nhead h3 { margin: 0; font-size: 17px; }
  #notemodal .nx { background: none; border: none; color: var(--muted); font-size: 19px; cursor: pointer; line-height: 1; }
  #notemodal .nx:hover { color: var(--txt); }
  #note-text { width: 100%; min-height: 220px; resize: vertical; background: var(--panel2);
    border: 1px solid var(--line); color: var(--txt); border-radius: 9px; padding: 12px; font: inherit; line-height: 1.5; }
  #notemodal .nfiles { margin-top: 16px; }
  #notemodal .nfiles .lbl { font-size: 12px; color: var(--muted); margin-bottom: 7px; font-weight: 700; }
  #notemodal .nfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
  #notemodal .nfoot .msg { font-size: 12px; color: var(--muted); }
  #gate {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #gate .box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px; width: 100%; max-width: 340px; text-align: center;
  }
  #gate h2 { margin: 0 0 6px; font-size: 18px; }
  #gate p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  #gate input {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 9px; padding: 11px 12px; font: inherit; font-size: 15px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; background: var(--accent); color: #1a1205; border: none;
    border-radius: 9px; padding: 11px; font: inherit; font-weight: 800; cursor: pointer;
  }
  #gate .err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 10px; }
  body.locked { overflow: hidden; }
</style>
</head>
<body class="locked">
<div id="gate">
  <div class="box">
    <h2>Trans American Trail</h2>
    <p>Admin. Enter the passcode to continue.</p>
    <input id="gate-input" type="password" placeholder="Passcode" autocomplete="off" />
    <button id="gate-go">Enter</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>
<header>
  <img class="logo" src="logo.jpg" alt="" />
  <h1>Trans American Trail - Admin</h1>
  <div class="tabs">
    <button class="tab on" id="tab-tasks">Tasks</button>
    <button class="tab" id="tab-gear">Gear</button>
    <button class="tab" id="tab-upgrades">Bike Upgrades</button>
  </div>
  <span class="status" id="status">connecting…</span>
</header>

<main>
  <p class="hint" id="hint"></p>
  <div id="scopebar" class="scopebar" style="display:none"></div>
  <div id="content"></div>
  <div class="savebar">
    <button class="btn primary" id="save">Save changes</button>
    <button class="btn" id="reload">Reload</button>
    <span class="msg" id="msg"></span>
  </div>
</main>

<div id="notemodal" style="display:none">
  <div class="nbox">
    <div class="nhead">
      <h3 id="note-title">Note</h3>
      <button class="nx" id="note-close" title="Close">✕</button>
    </div>
    <textarea id="note-text" placeholder="Write a note for this task…"></textarea>
    <div class="nfiles">
      <div class="lbl">Attachments</div>
      <div id="note-files"></div>
    </div>
    <div class="nfoot">
      <span class="msg" id="note-msg"></span>
      <button class="btn primary" id="note-save">Save note</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://rtwzlkymabujfsnobipl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_7z5_6oZEVl-poPycyYJ1zA_FjdebGQZ";

const KIT_CATEGORIES = [
  { id: "gear", label: "Riding Gear" },
  { id: "luggage", label: "Luggage" },
  { id: "electronics", label: "Electronics" },
  { id: "camping", label: "Camping" },
];

const BIKES = [
  { id: "universal", name: "Universal (all bikes)" },
  { id: "dr650", name: "Suzuki DR650" },
  { id: "drz400", name: "Suzuki DR-Z400S / SM" },
  { id: "xr650l", name: "Honda XR650L" },
  { id: "crf300l", name: "Honda CRF300L" },
  { id: "crf300l_rally", name: "Honda CRF300L Rally" },
  { id: "crf450rl", name: "Honda CRF450RL" },
  { id: "klr650", name: "Kawasaki KLR650" },
  { id: "wr250r", name: "Yamaha WR250R" },
  { id: "xt250", name: "Yamaha XT250" },
  { id: "ktm_exc_350_450", name: "KTM 350 EXC-F" },
  { id: "ktm_exc_500", name: "KTM 500 EXC-F" },
  { id: "beta_500rrs", name: "Beta 500 RR-S" },
  { id: "ktm690", name: "KTM 690 Enduro R" },
  { id: "husky701", name: "Husqvarna 701 Enduro" },
  { id: "tenere700", name: "Yamaha Ténéré 700" },
  { id: "ktm790adv", name: "KTM 790 Adventure" },
  { id: "ktm890adv", name: "KTM 890 Adventure" },
  { id: "transalp", name: "Honda XL750 Transalp" },
  { id: "desertx", name: "Ducati DesertX" },
  { id: "f900gs", name: "BMW F 900 GS" },
  { id: "f850gs", name: "BMW F800GS / F850GS" },
  { id: "himalayan", name: "Royal Enfield Himalayan" },
  { id: "ibex450", name: "CFMoto Ibex 450" },
  { id: "africa_twin", name: "Honda Africa Twin" },
  { id: "bmw1300gs", name: "BMW R 1300 GS" },
  { id: "ktm1290adv", name: "KTM 1290 Super Adventure" },
  { id: "panamerica", name: "Harley-Davidson Pan America 1250" },
  { id: "vstrom800de", name: "Suzuki V-Strom 800DE" },
  { id: "vstrom1050de", name: "Suzuki V-Strom 1050DE" },
  { id: "xr650r", name: "Honda XR650R" },
  { id: "dr350", name: "Suzuki DR350" },
];

const TASK_STATUSES = [
  { id: "todo",    label: "To Do",         color: "#3aa0ff" },
  { id: "working", label: "Working on it", color: "#f5a623" },
  { id: "stuck",   label: "Stuck",         color: "#ff5a5a" },
  { id: "done",    label: "Done",          color: "#37c871" },
];
const TASK_OWNERS = ["", "Peter", "Patrick", "Austin", "Shameen"];
const TASK_STATUS = ["none", "not_started", "on_track", "stuck", "ready", "done"];
const TASK_STATUS_LABEL = { none: "", not_started: "Not started", on_track: "On track", stuck: "Stuck", ready: "Ready for review", done: "Done" };
const TASK_PRIORITIES = [
  { id: "low",  label: "Low" },
  { id: "med",  label: "Medium" },
  { id: "high", label: "High" },
];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const statusEl = document.getElementById("status");
const contentEl = document.getElementById("content");
const scopebarEl = document.getElementById("scopebar");
const msgEl = document.getElementById("msg");
const hintEl = document.getElementById("hint");

let mode = "tasks";         // "tasks" | "gear" | "upgrades"
let upgradeScope = "universal";
let tierSortDir = 0;        // 0 = none, 1 = asc, -1 = desc
let gearRows = [];          // working copy
let upgradeRows = [];       // working copy (current scope only)
let tasksRows = [];         // working copy (shared task board)
let taskSortByDue = false;   // false = manual order, true = sort each group by due date
let taskSortByOwner = false; // sort each group by assigned owner
let taskCollapsed = new Set(); // category keys whose block is collapsed
let removedIds = new Set(); // ids deleted in this session, per table flush
let loadedIds = new Set();  // ids that existed on load (to detect removals)

function uid(prefix) {
  return prefix + "-" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
}
function setStatus(txt, cls) {
  statusEl.textContent = txt;
  statusEl.className = "status" + (cls ? " " + cls : "");
}
function setMsg(txt, cls) {
  msgEl.textContent = txt;
  msgEl.className = "msg" + (cls ? " " + cls : "");
}

// ---------------- GEAR ----------------
async function loadGear() {
  setMsg("");
  const { data, error } = await sb.from("gear").select("*").order("sort_order", { ascending: true });
  if (error) { setStatus("read error", "err"); setMsg(error.message, "err"); return; }
  gearRows = (data || []).map(r => ({
    id: r.id, category: r.category || "gear", name: r.name || "", note: r.note || "",
    price_usd: r.price_usd == null ? 0 : Number(r.price_usd), url: r.url || "", search: r.search || "",
    optional: !!r.optional, specific: !!r.specific, slot: r.slot || "",
  }));
  loadedIds = new Set(gearRows.map(r => r.id));
  removedIds = new Set();
  setStatus("connected · " + gearRows.length + " gear rows", "ok");
  renderGear();
}

function renderGear() {
  scopebarEl.style.display = "none";
  hintEl.textContent = "Edit any cell. Rows save in the order shown (top to bottom). Add rows per category, delete with ✕. Changes push live to phones on Save.";
  const byCat = {};
  KIT_CATEGORIES.forEach(c => byCat[c.id] = []);
  gearRows.forEach(r => { (byCat[r.category] ||= []).push(r); });
  let html = "";
  KIT_CATEGORIES.forEach(cat => {
    const rows = byCat[cat.id] || [];
    html += `<div class="catblock"><h2>${cat.label} (${rows.length})</h2>
      <table><thead><tr>
        <th class="colid">id</th><th>name</th><th>note</th>
        <th class="colnum">price $</th><th>url</th><th class="colsearch">search</th>
        <th class="colchk">opt</th><th class="colchk">spec</th><th class="coltier">slot</th><th class="colact"></th>
      </tr></thead><tbody>`;
    rows.forEach(r => {
      const i = gearRows.indexOf(r);
      html += `<tr>
        <td class="colid"><input value="${esc(r.id)}" data-i="${i}" data-f="id"></td>
        <td><input value="${esc(r.name)}" data-i="${i}" data-f="name"></td>
        <td><textarea rows="2" data-i="${i}" data-f="note">${esc(r.note)}</textarea></td>
        <td class="num colnum"><input type="number" step="1" value="${r.price_usd}" data-i="${i}" data-f="price_usd"></td>
        <td><input value="${esc(r.url)}" data-i="${i}" data-f="url"></td>
        <td class="colsearch"><input value="${esc(r.search)}" data-i="${i}" data-f="search"></td>
        <td class="chk colchk"><input type="checkbox" ${r.optional ? "checked" : ""} data-i="${i}" data-f="optional"></td>
        <td class="chk colchk"><input type="checkbox" ${r.specific ? "checked" : ""} data-i="${i}" data-f="specific"></td>
        <td class="coltier"><input value="${esc(r.slot)}" data-i="${i}" data-f="slot"></td>
        <td class="act colact"><button class="btn danger" data-del="${i}" data-t="gear">✕</button></td>
      </tr>`;
    });
    html += `</tbody></table>
      <button class="btn add" data-add="${cat.id}">+ Add ${cat.label} item</button></div>`;
  });
  contentEl.innerHTML = html;
  wireGearInputs();
}

function wireGearInputs() {
  contentEl.querySelectorAll("input,textarea").forEach(el => {
    el.addEventListener("input", () => {
      const i = +el.dataset.i, f = el.dataset.f;
      if (i == null || !f) return;
      if (f === "optional" || f === "specific") gearRows[i][f] = el.checked;
      else if (f === "price_usd") gearRows[i][f] = Number(el.value) || 0;
      else gearRows[i][f] = el.value;
      markDirty();
    });
  });
  contentEl.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.del;
    const row = gearRows[i];
    if (!confirm("Delete gear row \"" + (row.name || row.id) + "\"?")) return;
    if (loadedIds.has(row.id)) removedIds.add(row.id);
    gearRows.splice(i, 1);
    renderGear(); markDirty();
  }));
  contentEl.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
    const cat = b.dataset.add;
    gearRows.push({ id: uid(cat), category: cat, name: "", note: "", price_usd: 0, url: "", search: "", optional: false, specific: false, slot: "" });
    renderGear(); markDirty();
  }));
}

async function saveGear() {
  // Validate ids unique + non-empty.
  const ids = gearRows.map(r => r.id.trim());
  if (ids.some(x => !x)) { setMsg("Every row needs an id.", "err"); return; }
  if (new Set(ids).size !== ids.length) { setMsg("Duplicate ids. Ids must be unique.", "err"); return; }
  setMsg("Saving…");
  // Delete removed rows first.
  for (const id of removedIds) {
    const { error } = await sb.from("gear").delete().eq("id", id);
    if (error) { setMsg("Delete failed: " + error.message, "err"); return; }
  }
  const payload = gearRows.map((r, i) => ({
    id: r.id.trim(), category: r.category, name: r.name, note: r.note || null,
    price_usd: Number(r.price_usd) || 0, url: r.url || null, search: r.search || null,
    optional: !!r.optional, specific: !!r.specific, slot: r.slot || null, sort_order: i,
  }));
  const { error } = await sb.from("gear").upsert(payload);
  if (error) { setMsg("Save failed: " + error.message, "err"); return; }
  setMsg("Saved " + payload.length + " gear rows. Live on phones now.", "ok");
  await loadGear();
}

function renderScopebar() {

    </tr></thead><tbody>`;

    html += `<tr>

      <td><input value="${esc(r.item)}" data-i="${i}" data-f="item"></td>

      <td class="coltier"><input value="${esc(r.tier)}" data-i="${i}" data-f="tier"></td>

      <td class="colsearch"><input value="${esc(r.search)}" data-i="${i}" data-f="search"></td>
      <td class="act colact">
        <button class="btn move" data-up="${i}" title="Move up"${i === 0 ? " disabled" : ""}>▲</button>
        <button class="btn move" data-down="${i}" title="Move down"${i === upgradeRows.length - 1 ? " disabled" : ""}>▼</button>
        <button class="btn danger" data-del="${i}">✕</button>
      </td>
    </tr>`;
  });
  html += `</tbody></table><button class="btn add" data-addup="1">+ Add upgrade</button></div>`;

function wireUpgradeInputs() {
  contentEl.querySelectorAll("input,textarea").forEach(el => {
    el.addEventListener("input", () => {
      const i = +el.dataset.i, f = el.dataset.f;
      if (i == null || !f) return;
      if (f === "price_usd") upgradeRows[i][f] = el.value === "" ? "" : (Number(el.value) || 0);
      else upgradeRows[i][f] = el.value;
      markDirty();
    });
  });
  contentEl.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.del, row = upgradeRows[i];
    if (!confirm("Delete upgrade \"" + (row.item || row.id) + "\"?")) return;
    if (loadedIds.has(row.id)) removedIds.add(row.id);
    upgradeRows.splice(i, 1);
    renderUpgrades(); markDirty();
  }));
  contentEl.querySelectorAll("[data-addup]").forEach(b => b.addEventListener("click", () => {
    const p = upgradeScope === "universal" ? "u" : upgradeScope;
    upgradeRows.push({ id: uid(p), item: "", why: "", price_usd: "", tier: "", url: "", search: "" });
    renderUpgrades(); markDirty();
  }));
  const tierHead = contentEl.querySelector("[data-sorttier]");
  if (tierHead) tierHead.addEventListener("click", sortUpgradesByTier);
  contentEl.querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => moveUpgrade(+b.dataset.up, -1)));
  contentEl.querySelectorAll("[data-down]").forEach(b => b.addEventListener("click", () => moveUpgrade(+b.dataset.down, 1)));
}

// Swap a row with its neighbour to hand-arrange the exact order. The row order
// shown here is what saves into sort_order, so this sets the app display order.
function moveUpgrade(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= upgradeRows.length) return;
  const t = upgradeRows[i]; upgradeRows[i] = upgradeRows[j]; upgradeRows[j] = t;
  renderUpgrades(); markDirty();
}

// Sort the current bike's upgrade rows by the tier column. Click toggles
// ascending -> descending. Empty tiers always sink to the bottom. Numeric tiers
// sort numerically; text tiers fall back to alphabetical. Saving persists the
// new order (rows save top-to-bottom), so this doubles as a reorder tool.
function sortUpgradesByTier() {
  tierSortDir = tierSortDir === 1 ? -1 : 1;
  const rank = (t) => {
    const s = String(t == null ? "" : t).trim();
    if (!s) return { empty: true, n: null, s: "" };
    const n = parseFloat(s);
    return { empty: false, n: isNaN(n) ? null : n, s: s.toLowerCase() };
  };
  upgradeRows.sort((a, b) => {
    const ra = rank(a.tier), rb = rank(b.tier);
    if (ra.empty && rb.empty) return 0;
    if (ra.empty) return 1;   // empties always last
    if (rb.empty) return -1;
    let cmp;
    if (ra.n != null && rb.n != null) cmp = ra.n - rb.n;
    else cmp = ra.s.localeCompare(rb.s);
    return cmp * tierSortDir;
  });
  renderUpgrades();
  markDirty();
}

async function saveUpgrades() {
  const ids = upgradeRows.map(r => r.id.trim());
  if (ids.some(x => !x)) { setMsg("Every row needs an id.", "err"); return; }
  if (new Set(ids).size !== ids.length) { setMsg("Duplicate ids. Ids must be unique.", "err"); return; }
  setMsg("Saving…");
  for (const id of removedIds) {
    const { error } = await sb.from("bike_upgrades").delete().eq("id", id);
    if (error) { setMsg("Delete failed: " + error.message, "err"); return; }
  }
  const bikeId = upgradeScope === "universal" ? null : upgradeScope;
  const payload = upgradeRows.map((r, i) => ({
    id: r.id.trim(), bike_id: bikeId, item: r.item, why: r.why || "",
    price_usd: r.price_usd === "" ? null : (Number(r.price_usd) || 0),
    tier: r.tier || null, url: r.url || null, search: r.search || null, sort_order: i,
  }));
  const { error } = await sb.from("bike_upgrades").upsert(payload);
  if (error) { setMsg("Save failed: " + error.message, "err"); return; }
  setMsg("Saved " + payload.length + " upgrades. Live on phones now.", "ok");
  await loadUpgrades();
}

// ---------------- TASKS ----------------
async function loadTasks() {
  setMsg("");
  scopebarEl.style.display = "none";
  const { data, error } = await sb.from("tasks").select("*").order("sort_order", { ascending: true });
  if (error) { setStatus("read error", "err"); setMsg(error.message, "err"); return; }
  tasksRows = (data || []).map(r => ({
    id: r.id, title: r.title || "", notes: r.notes || "", category: r.category || "",
    status: TASK_STATUS.includes(r.status) ? r.status : "none", owner: r.owner || "",
    priority: r.priority || "med", due_date: r.due_date || "",
    attachments: Array.isArray(r.attachments) ? r.attachments : [],
    memo: r.memo || "", archived: !!r.archived,
  }));
  loadedIds = new Set(tasksRows.map(r => r.id));
  removedIds = new Set();
  const open = tasksRows.filter(r => r.status !== "done").length;
  setStatus("connected · " + open + " open / " + tasksRows.length + " total", "ok");
  renderTasks();
}

// Distinct categories in first-seen order (blank grouped as Uncategorized).
function taskCategories() {
  const seen = [];
  tasksRows.forEach(r => { const c = (r.category || "").trim(); if (!seen.includes(c)) seen.push(c); });
  if (seen.length === 0) seen.push("");
  return seen;
}
// Siblings that share a category and archive-state (the reorder scope).
function taskSiblings(r) {
  if (r.archived) return tasksRows.filter(x => x.archived);
  const cat = (r.category || "").trim();
  return tasksRows.filter(x => !x.archived && (x.category || "").trim() === cat);
}

function renderTasks() {
  scopebarEl.style.display = "none";
  hintEl.textContent = "";
  const cats = taskCategories();
  const byDue = (a, b) => {                       // blank due dates sink to the bottom
    const da = a.due_date || "", db = b.due_date || "";
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da < db ? -1 : da > db ? 1 : 0;
  };
  const byOwner = (a, b) => {                      // blank owners sink to the bottom
    const oa = (a.owner || "").trim(), ob = (b.owner || "").trim();
    if (!oa && !ob) return 0;
    if (!oa) return 1;
    if (!ob) return -1;
    return oa.localeCompare(ob);
  };
  const applySort = (list) =>
    taskSortByOwner ? list.slice().sort(byOwner)
    : taskSortByDue ? list.slice().sort(byDue)
    : list;
  const sortActive = taskSortByDue || taskSortByOwner;
  const ownerArrow = taskSortByOwner ? "▲" : "⇅";
  const dueArrow = taskSortByDue ? "▲" : "⇅";
  let html = "";
  const thead = `<thead><tr>
        <th class="colnotes">detail</th>
        <th class="colowner sortable" data-sortown="1">assigned to <span class="arrow">${ownerArrow}</span></th>
        <th class="coldue sortable" data-sortdue="1">due <span class="arrow">${dueArrow}</span></th>
        <th class="colnote">note</th>
        <th class="colstatus">status</th><th class="colact"></th>
      </tr></thead>`;
  const rowHtml = (r) => {
    const i = tasksRows.indexOf(r);
    const isDone = r.status === "done";
    const sibs = taskSiblings(r);
    const si = sibs.indexOf(r);
    const ownerOpts = TASK_OWNERS.map(o =>
      `<option value="${esc(o)}" ${o === r.owner ? "selected" : ""}>${o ? esc(o) : "—"}</option>`).join("");
    const st = TASK_STATUS.includes(r.status) ? r.status : "none";
    const statusOpts = TASK_STATUS.map(s =>
      `<option value="${s}" ${s === st ? "selected" : ""}>${TASK_STATUS_LABEL[s]}</option>`).join("");
    return `<tr class="${isDone ? "taskdone" : ""}">
        <td class="colnotes"><textarea rows="2" data-i="${i}" data-f="notes" placeholder="What needs doing">${esc(r.notes)}</textarea></td>
        <td class="colowner"><select data-i="${i}" data-f="owner">${ownerOpts}</select></td>
        <td class="coldue"><input type="date" value="${esc(r.due_date)}" data-i="${i}" data-f="due_date" onclick="try{this.showPicker()}catch(e){}"></td>
        <td class="colnote">${renderNoteCell(r, i)}</td>
        <td class="colstatus"><select class="statussel status-${st}" data-i="${i}" data-f="status">${statusOpts}</select></td>
        <td class="act colact">
          <button class="btn move" data-up="${i}" title="Move up"${sortActive || si === 0 ? " disabled" : ""}>▲</button>
          <button class="btn move" data-down="${i}" title="Move down"${sortActive || si === sibs.length - 1 ? " disabled" : ""}>▼</button>
          ${r.archived
            ? `<button class="btn" data-unarch="${i}" title="Restore to board">↩</button>`
            : `<button class="btn arch" data-arch="${i}" title="Archive to bottom">Archive</button>`}
          <button class="btn danger" data-del="${i}">✕</button>
        </td>
      </tr>`;
  };
  // Category blocks show LIVE (non-archived) tasks, done ones included so they
  // stay visible for review until archived. Archived tasks collect below.
  cats.forEach((cat, ci) => {
    let live = tasksRows.filter(r => (r.category || "").trim() === cat && !r.archived);
    live = applySort(live);
    const doneCount = live.filter(r => r.status === "done").length;
    const label = cat || "Uncategorized";
    const countTxt = doneCount ? `${live.length} live · ${doneCount} done` : `${live.length} live`;
    const collapsed = taskCollapsed.has(cat);
    html += `<div class="catblock">
      <h2 class="grouphdr collapser" data-collapse="${esc(cat)}"><span class="caret">${collapsed ? "▸" : "▾"}</span> ${esc(label)} <span style="color:var(--muted);font-weight:700;font-size:12px">(${countTxt})</span>
        <span class="catmove">
          <button class="btn move" data-catup="${esc(cat)}" title="Move category up"${ci === 0 ? " disabled" : ""}>▲</button>
          <button class="btn move" data-catdown="${esc(cat)}" title="Move category down"${ci === cats.length - 1 ? " disabled" : ""}>▼</button>
        </span>
      </h2>
      ${collapsed ? "" : `<table>${thead}<tbody>${live.map(rowHtml).join("")}</tbody></table>
      <button class="btn add" data-addtask="${esc(cat)}">+ Add task</button>`}</div>`;
  });
  html += `<button class="btn add" data-addcat="1" style="margin-top:4px">+ Add category</button>`;
  // Single "Archived" section at the very bottom of the whole board.
  let archRows = tasksRows.filter(r => r.archived);
  if (archRows.length) {
    archRows = applySort(archRows);
    const aCollapsed = taskCollapsed.has("__archived__");
    html += `<div class="catblock donesection">
      <h2 class="grouphdr collapser" data-collapse="__archived__"><span class="caret">${aCollapsed ? "▸" : "▾"}</span> Archived <span style="color:var(--muted);font-weight:700;font-size:12px">(${archRows.length})</span></h2>
      ${aCollapsed ? "" : `<table>${thead}<tbody>${archRows.map(rowHtml).join("")}</tbody></table>`}</div>`;
  }
  contentEl.innerHTML = html;
  wireTaskInputs();
}

function wireTaskInputs() {
  contentEl.querySelectorAll("input,textarea,select").forEach(el => {
    const f = el.dataset.f;
    if (!f) return;
    if (f === "status") {
      el.addEventListener("change", () => {
        tasksRows[+el.dataset.i].status = el.value;
        renderTasks(); markDirty();          // done stays put; Archive is what drops it
      });
    } else if (f === "category") {
      el.addEventListener("input", () => { tasksRows[+el.dataset.i].category = el.value; markDirty(); });
      el.addEventListener("change", () => renderTasks());   // regroup on blur
    } else {
      const evt = el.tagName === "SELECT" ? "change" : "input";
      el.addEventListener(evt, () => { tasksRows[+el.dataset.i][f] = el.value; markDirty(); });
    }
  });
  contentEl.querySelectorAll('textarea[data-f="notes"]').forEach(t => t.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {   // Enter saves the row; Shift+Enter = newline
      e.preventDefault();
      const i = +t.dataset.i;
      tasksRows[i].notes = t.value;
      saveOneTask(i);
      t.blur();
    }
  }));
  contentEl.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.del, row = tasksRows[i];
    if (!confirm("Delete task \"" + ((row.notes || "").trim() || row.id) + "\"?")) return;
    if (loadedIds.has(row.id)) removedIds.add(row.id);
    tasksRows.splice(i, 1);
    renderTasks(); markDirty();
  }));
  contentEl.querySelectorAll("[data-addtask]").forEach(b => b.addEventListener("click", () => {
    tasksRows.push({ id: uid("task"), title: "", notes: "", category: b.dataset.addtask || "", status: "none", owner: "", priority: "med", due_date: "", attachments: [], memo: "", archived: false });
    renderTasks(); markDirty();
  }));
  const addCat = contentEl.querySelector("[data-addcat]");
  if (addCat) addCat.addEventListener("click", () => {
    const name = prompt("New category name:");
    if (name === null) return;
    tasksRows.push({ id: uid("task"), title: "", notes: "", category: name.trim(), status: "none", owner: "", priority: "med", due_date: "", attachments: [], memo: "", archived: false });
    renderTasks(); markDirty();
  });
  contentEl.querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => moveTask(+b.dataset.up, -1)));
  contentEl.querySelectorAll("[data-down]").forEach(b => b.addEventListener("click", () => moveTask(+b.dataset.down, 1)));
  contentEl.querySelectorAll("[data-sortdue]").forEach(h => h.addEventListener("click", () => {
    taskSortByDue = !taskSortByDue; taskSortByOwner = false; renderTasks();
  }));
  contentEl.querySelectorAll("[data-sortown]").forEach(h => h.addEventListener("click", () => {
    taskSortByOwner = !taskSortByOwner; taskSortByDue = false; renderTasks();
  }));
  contentEl.querySelectorAll("[data-collapse]").forEach(h => h.addEventListener("click", () => {
    const key = h.dataset.collapse;
    if (taskCollapsed.has(key)) taskCollapsed.delete(key); else taskCollapsed.add(key);
    renderTasks();
  }));
  contentEl.querySelectorAll("[data-catup]").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation(); moveCategory(b.dataset.catup, -1);
  }));
  contentEl.querySelectorAll("[data-catdown]").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation(); moveCategory(b.dataset.catdown, 1);
  }));
  contentEl.querySelectorAll("[data-arch]").forEach(b => b.addEventListener("click", () => {
    tasksRows[+b.dataset.arch].archived = true; renderTasks(); markDirty();
  }));
  contentEl.querySelectorAll("[data-unarch]").forEach(b => b.addEventListener("click", () => {
    tasksRows[+b.dataset.unarch].archived = false; renderTasks(); markDirty();
  }));
  contentEl.querySelectorAll("[data-note]").forEach(b =>
    b.addEventListener("click", () => openNoteModal(+b.dataset.note)));
}

// Swap a task with its nearest sibling (same category + archive-state). The global
// row order is what saves into sort_order, so this hand-arranges the board.
function moveTask(i, dir) {
  const r = tasksRows[i];
  const cat = (r.category || "").trim(), arch = !!r.archived;
  let j = i + dir;
  while (j >= 0 && j < tasksRows.length) {
    const x = tasksRows[j];
    const match = arch
      ? !!x.archived                                              // archived = one global group
      : (!x.archived && (x.category || "").trim() === cat);       // live = grouped by category
    if (match) break;
    j += dir;
  }
  if (j < 0 || j >= tasksRows.length) return;
  const t = tasksRows[i]; tasksRows[i] = tasksRows[j]; tasksRows[j] = t;
  renderTasks(); markDirty();
}

// Move a whole category block up or down. Category order is derived from the
// first-seen order of rows, so we regroup tasksRows by the swapped category order.
// Rows keep their in-category order; sort_order persists on Save.
function moveCategory(cat, dir) {
  cat = (cat || "").trim();
  const cats = taskCategories();
  const idx = cats.indexOf(cat);
  const tgt = idx + dir;
  if (idx < 0 || tgt < 0 || tgt >= cats.length) return;
  const t = cats[idx]; cats[idx] = cats[tgt]; cats[tgt] = t;
  const byCat = {};
  cats.forEach(c => byCat[c] = []);
  tasksRows.forEach(r => { const c = (r.category || "").trim(); (byCat[c] ||= []).push(r); });
  tasksRows = cats.flatMap(c => byCat[c]);
  renderTasks(); markDirty();
}

// Row cell: a single icon that opens the note modal. Fills in when the task
// carries a note and/or attachments so it stays visible on the board.
function renderNoteCell(r, i) {
  const nFiles = Array.isArray(r.attachments) ? r.attachments.length : 0;
  const has = !!(r.memo || "").trim() || nFiles > 0;
  const badge = nFiles ? `<span class="badge">${nFiles}</span>` : "";
  const glyph = has ? "🗒" : "＋";
  const title = has ? "View / edit note" : "Add a note";
  return `<button class="notebtn ${has ? "has" : ""}" data-note="${i}" title="${title}">${glyph}${badge}</button>`;
}

// Attachment chips + add button, rendered inside the note modal.
function renderModalAttachments(r, i) {
  const files = Array.isArray(r.attachments) ? r.attachments : [];
  const chips = files.map((f, k) =>
    `<span class="filechip"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>` +
    `<button class="filex" data-fi="${i}" data-fk="${k}" title="Remove">✕</button></span>`).join("");
  return `<div class="files">${chips}` +
    `<label class="btn attach" title="Attach files">＋<input type="file" data-fileup="${i}" hidden multiple></label></div>`;
}

let noteIdx = -1;
function openNoteModal(i) {
  noteIdx = i;
  const r = tasksRows[i];
  const label = (r.notes || "").trim();
  document.getElementById("note-title").textContent = label ? ("Note · " + label.slice(0, 60)) : "Note";
  document.getElementById("note-text").value = r.memo || "";
  document.getElementById("note-msg").textContent = "";
  renderModalFiles();
  document.getElementById("notemodal").style.display = "flex";
  document.getElementById("note-text").focus();
}
function closeNoteModal() {
  document.getElementById("notemodal").style.display = "none";
  noteIdx = -1;
}
function renderModalFiles() {
  if (noteIdx < 0) return;
  const box = document.getElementById("note-files");
  box.innerHTML = renderModalAttachments(tasksRows[noteIdx], noteIdx);
  box.querySelectorAll("[data-fileup]").forEach(inp => inp.addEventListener("change", () => {
    if (inp.files && inp.files.length) uploadTaskFiles(+inp.dataset.fileup, Array.from(inp.files));
  }));
  box.querySelectorAll(".filex").forEach(b =>
    b.addEventListener("click", () => removeAttachment(+b.dataset.fi, +b.dataset.fk)));
}

async function uploadTaskFiles(i, fileList) {
  const row = tasksRows[i];
  if (!Array.isArray(row.attachments)) row.attachments = [];
  const MAX = 10 * 1024 * 1024;
  const toobig = fileList.find(f => f.size > MAX);
  if (toobig) { setMsg(`"${toobig.name}" is over the 10 MB limit.`, "err"); return; }
  setMsg("Uploading…");
  for (const file of fileList) {
    const clean = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = row.id + "/" + Date.now() + "-" + clean;
    const { error } = await sb.storage.from("task-files").upload(path, file, { upsert: true });
    if (error) { setMsg("Upload failed: " + error.message, "err"); return; }
    const { data } = sb.storage.from("task-files").getPublicUrl(path);
    row.attachments.push({ name: file.name, url: data.publicUrl, path });
  }
  renderTasks(); renderModalFiles(); markDirty();
  const nm = document.getElementById("note-msg");
  if (nm) nm.textContent = "File attached. Hit Save note to keep it.";
  setMsg("File attached. Click Save to keep it on the task.", "");
}

async function removeAttachment(i, k) {
  const row = tasksRows[i];
  const f = (row.attachments || [])[k];
  if (!f) return;
  if (!confirm("Remove \"" + (f.name || "file") + "\"?")) return;
  if (f.path) { try { await sb.storage.from("task-files").remove([f.path]); } catch (e) {} }
  row.attachments.splice(k, 1);
  renderTasks(); renderModalFiles(); markDirty();
}

// Single row -> DB row. Shared by full save, note save, and Enter-to-save.
function taskPayload(r, i) {
  return {
    id: r.id.trim(), title: (r.notes || "").trim(), notes: r.notes || null,
    category: (r.category || "").trim() || null,
    status: TASK_STATUS.includes(r.status) ? r.status : "none", owner: r.owner || null,
    priority: r.priority || "med", due_date: r.due_date || null, sort_order: i,
    attachments: Array.isArray(r.attachments) ? r.attachments : [],
    memo: (r.memo || "").trim() || null, archived: !!r.archived,
  };
}

// Monday-style: hit Enter in a task's detail and just that row saves to the cloud.
async function saveOneTask(i) {
  const r = tasksRows[i];
  if (!(r.notes || "").trim()) return;   // nothing to commit yet
  setMsg("Saving…");
  const { error } = await sb.from("tasks").upsert(taskPayload(r, i));
  if (error) { setMsg("Save failed: " + error.message, "err"); return; }
  loadedIds.add(r.id.trim());
  setMsg("Saved.", "ok");
}

async function saveTasks() {
  const ids = tasksRows.map(r => r.id.trim());
  if (ids.some(x => !x)) { setMsg("Every task needs an id.", "err"); return; }
  if (new Set(ids).size !== ids.length) { setMsg("Duplicate ids. Ids must be unique.", "err"); return; }
  if (tasksRows.some(r => !(r.notes || "").trim())) { setMsg("Every task needs a detail.", "err"); return; }
  setMsg("Saving…");
  for (const id of removedIds) {
    const { error } = await sb.from("tasks").delete().eq("id", id);
    if (error) { setMsg("Delete failed: " + error.message, "err"); return; }
  }
  const payload = tasksRows.map((r, i) => taskPayload(r, i));
  const { error } = await sb.from("tasks").upsert(payload);
  if (error) { setMsg("Save failed: " + error.message, "err"); return; }
  setMsg("Saved " + payload.length + " tasks.", "ok");
  await loadTasks();
}

// ---------------- shared ----------------
let isDirty = false;
function markDirty() { isDirty = true; setMsg("Unsaved changes.", ""); msgEl.classList.add("dirty"); }
// A browser refresh/close bypasses the in-app confirms, so guard it too. This is
// what stops "I added tasks and they disappeared" when the page reloads unsaved.
window.addEventListener("beforeunload", (e) => {
  if (!isDirty) return;
  e.preventDefault(); e.returnValue = "";
});
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function selectTab(id) {
  ["tab-gear", "tab-upgrades", "tab-tasks"].forEach(t =>
    document.getElementById(t).classList.toggle("on", t === id));
}
document.getElementById("tab-gear").addEventListener("click", async () => {
  if (isDirty && !confirm("Discard unsaved changes?")) return;
  mode = "gear"; isDirty = false; selectTab("tab-gear");
  await loadGear();
});
document.getElementById("tab-upgrades").addEventListener("click", async () => {
  if (isDirty && !confirm("Discard unsaved changes?")) return;
  mode = "upgrades"; isDirty = false; selectTab("tab-upgrades");
  await loadUpgrades();
});
document.getElementById("tab-tasks").addEventListener("click", async () => {
  if (isDirty && !confirm("Discard unsaved changes?")) return;
  mode = "tasks"; isDirty = false; selectTab("tab-tasks");
  await loadTasks();
});
function loadCurrent() {
  return mode === "gear" ? loadGear() : mode === "upgrades" ? loadUpgrades() : loadTasks();
}
function saveCurrent() {
  return mode === "gear" ? saveGear() : mode === "upgrades" ? saveUpgrades() : saveTasks();
}
document.getElementById("save").addEventListener("click", async () => {
  document.getElementById("save").disabled = true;
  try { await saveCurrent(); isDirty = false; }
  finally { document.getElementById("save").disabled = false; }
});
document.getElementById("reload").addEventListener("click", async () => {
  if (isDirty && !confirm("Discard unsaved changes and reload?")) return;
  isDirty = false;
  await loadCurrent();
});

// ---------------- note modal ----------------
document.getElementById("note-text").addEventListener("input", (e) => {
  if (noteIdx < 0) return;
  tasksRows[noteIdx].memo = e.target.value;
});
document.getElementById("note-close").addEventListener("click", closeNoteModal);
document.getElementById("notemodal").addEventListener("click", (e) => {
  if (e.target.id === "notemodal") closeNoteModal();   // click backdrop to close
});
document.getElementById("note-save").addEventListener("click", async () => {
  if (noteIdx < 0) return;
  const r = tasksRows[noteIdx];
  r.memo = document.getElementById("note-text").value;
  const btn = document.getElementById("note-save");
  const nm = document.getElementById("note-msg");
  btn.disabled = true; nm.textContent = "Saving…";
  // Persist just this row so the note + files stay constant without a full board save.
  const { error } = await sb.from("tasks").upsert({
    id: r.id.trim(), title: (r.notes || "").trim(), notes: r.notes || null,
    category: (r.category || "").trim() || null,
    status: TASK_STATUS.includes(r.status) ? r.status : "none", owner: r.owner || null,
    priority: r.priority || "med", due_date: r.due_date || null,
    attachments: Array.isArray(r.attachments) ? r.attachments : [],
    memo: (r.memo || "").trim() || null, archived: !!r.archived,
  });
  btn.disabled = false;
  if (error) { nm.textContent = "Save failed: " + error.message; return; }
  loadedIds.add(r.id.trim());
  renderTasks();
  closeNoteModal();
  setMsg("Note saved.", "ok");
});

// ---------------- passcode gate ----------------
// Simple shared-passcode gate. This keeps casual visitors out of the editor.
// It is NOT hard security: the page talks to Supabase with the public anon key,
// so real lockdown would need Supabase Auth + tighter RLS. Change PASSCODE below
// (and re-deploy) any time.
const PASSCODE = "portorford";
const GATE_KEY = "gfm.admin.unlocked.v1";

function boot() {
  if (!SUPABASE_URL || SUPABASE_URL.indexOf("__") === 0) {
    setStatus("not configured", "err");
    contentEl.innerHTML = "<p style='color:#ff5a5a'>Supabase keys were not injected. Regenerate this page.</p>";
    return;
  }
  loadTasks();
}

function unlock() {
  document.getElementById("gate").style.display = "none";
  document.body.classList.remove("locked");
  boot();
}

(function initGate() {
  const gate = document.getElementById("gate");
  const input = document.getElementById("gate-input");
  const err = document.getElementById("gate-err");
  const go = document.getElementById("gate-go");
  if (localStorage.getItem(GATE_KEY) === PASSCODE) { unlock(); return; }
  function attempt() {
    if (input.value === PASSCODE) {
      try { localStorage.setItem(GATE_KEY, PASSCODE); } catch (e) {}
      unlock();
    } else {
      err.textContent = "Wrong passcode.";
      input.value = ""; input.focus();
    }
  }
  go.addEventListener("click", attempt);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") attempt(); });
  input.focus();
})();
</script>
